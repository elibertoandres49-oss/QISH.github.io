        .home-announce-card {

            background: rgba(255, 255, 255, 0.22);

            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }
        .home-announce-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.32);
            box-shadow: 0 10px 28px rgba(155, 89, 182, 0.2);
        }
        .home-announce-icon {
            width: 44px;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(155, 89, 182, 0.35);
        }

            border: none;

            margin: 0;
            font-size: 13px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;

        <a href="chat.html" class="chat-enter-btn">💬 进入聊天室</a>
    </div>

    <!-- 公告板块：点击弹出完整公告 -->

        <div class="home-announce-info">

        </div>

    </div>
</div>

<footer>© 2026 QISH · </footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    if (!window.QISH) return;
    await QISH.updateAuthNav({ supabase });
    supabase.auth.onAuthStateChange(() => {
        QISH.updateAuthNav({ supabase });
    });

    // 点击公告板块 → 弹出公告（手动打开，不受「本日不再提醒」限制）
    const card = document.getElementById("homeAnnounceCard");
    if (card) {
        card.addEventListener("click", () => {
            if (typeof QISH.showAnnounce === "function") {
                QISH.showAnnounce();
            }
        });
    }
});
</script>
