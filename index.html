        /* 时间详情弹窗 */
        .time-modal-mask {
            position: fixed;
            inset: 0;
            z-index: 10002;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .time-modal-mask.show {
            opacity: 1;
            visibility: visible;
        }
        .time-modal-box {
            width: min(380px, 92vw);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
            padding: 32px 28px 24px;
            text-align: center;
            transform: translateY(24px) scale(0.9);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            position: relative;
        }
        .time-modal-mask.show .time-modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .time-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;

            font-size: 18px;

<script>
// ========== 时间日期板块 ==========
(function initTimeCard() {
    const clockEl = document.getElementById("homeTimeClock");
    const dateEl = document.getElementById("homeTimeDate");
    const cardEl = document.getElementById("homeTimeCard");
    const modalMask = document.getElementById("timeModalMask");
    const modalClose = document.getElementById("timeModalClose");
    const modalClock = document.getElementById("timeModalClock");
    const modalDate = document.getElementById("timeModalDate");
    const modalWeekday = document.getElementById("timeModalWeekday");
    const modalDayOfYear = document.getElementById("timeModalDayOfYear");
    const modalToWeekend = document.getElementById("timeModalToWeekend");
    const modalSeason = document.getElementById("timeModalSeason");
    if (!clockEl || !dateEl || !cardEl) return;

    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const seasons = ["冬季", "冬季", "春季", "春季", "春季", "夏季", "夏季", "夏季", "秋季", "秋季", "秋季", "冬季"];

    function pad(n) { return String(n).padStart(2, "0"); }

    function getDayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0);
        const diff = d - start;
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function getDaysToWeekend(d) {
        const day = d.getDay(); // 0=周日, 6=周六
        if (day === 0 || day === 6) return "今天就是周末🎉";
        return (6 - day) + " 天";
    }

    function updateTime() {
        const now = new Date();
        const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
        clockEl.textContent = timeStr;
        dateEl.textContent = dateStr;
        if (modalClock) modalClock.textContent = timeStr;
        if (modalDate) modalDate.textContent = dateStr;
        if (modalWeekday) modalWeekday.textContent = weekdays[now.getDay()];
        if (modalDayOfYear) modalDayOfYear.textContent = `第 ${getDayOfYear(now)} 天`;
        if (modalToWeekend) modalToWeekend.textContent = getDaysToWeekend(now);
        if (modalSeason) modalSeason.textContent = seasons[now.getMonth()];
    }

    updateTime();
    setInterval(updateTime, 1000);

    // 点击卡片打开弹窗
    cardEl.addEventListener("click", () => {
        updateTime();
        modalMask.classList.add("show");
        document.body.style.overflow = "hidden";
    });

    function closeModal() {
        modalMask.classList.remove("show");
        document.body.style.overflow = "";
    }
    if (modalClose) modalClose.addEventListener("click", closeModal);
    if (modalMask) modalMask.addEventListener("click", (e) => {
        if (e.target === modalMask) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalMask && modalMask.classList.contains("show")) closeModal();
    });
})();

document.addEventListener("DOMContentLoaded", async () => {
    const client = window.supabaseClient || (typeof supabase !== "undefined" ? supabase : null);
    async function waitQ() {
        const t0 = Date.now();
        while (!window.QISH && Date.now() - t0 < 4000) {
            await new Promise(function (r) { setTimeout(r, 30); });
        }
    }
    await waitQ();
    if (window.QISH && client) {
        await QISH.updateAuthNav({ supabase: client });
        client.auth.onAuthStateChange(function (event) {
            if (event === "INITIAL_SESSION") return;
            QISH.updateAuthNav({ supabase: client });
        });
    }
    const card = document.getElementById("homeAnnounceCard");
    if (card) {
        card.addEventListener("click", function () {
            if (window.QISH && typeof QISH.showAnnounce === "function") QISH.showAnnounce();
        });
    }
});
</script>
