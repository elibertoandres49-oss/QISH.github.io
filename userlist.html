    <style>
        .userlist-wrap {
            max-width: 460px;
            margin: 40px auto;
        }

        .userlist-card {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
            padding: 32px;
            transition: transform 0.25s ease;
        }

        .userlist-card:hover {
            transform: translateY(-4px);
        }

        .userlist-card h1 {
            border-bottom: none;
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .userlist-desc {
            text-align: center;
            color: #555;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .online-count {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .online-count-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
            animation: online-pulse 2s infinite;
        }
        @keyframes online-pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .user-list-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s ease;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .user-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.45);
            display: block;
        }
        .online-indicator {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .online-indicator.online {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }
        .online-indicator.offline {
            background: #94a3b8;
            box-shadow: none;
        }

        .user-name {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-bio {
            font-size: 13px;
            color: #64748b;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .empty-tip {
            text-align: center;
            color: #555;
            padding: 20px 0;
            font-size: 15px;
        }

        @media (max-width: 640px) {
            .userlist-card {
                padding: 24px;
            }

            .user-avatar {
                width: 44px;
                height: 44px;
            }
            .user-name {
                font-size: 15px;
            }
        }

        /* ========== 用户详情弹窗 ========== */
        .user-modal-mask {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .user-modal-mask.show {
            opacity: 1;
            visibility: visible;
        }
        .user-modal-box {
            position: relative;
            width: min(380px, 92vw);
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 36px 28px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: translateY(120%) translateX(30px) scale(0.85) rotate(-6deg);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.4s ease;
        }
        .user-modal-mask.show .user-modal-box {
            transform: translateY(0) translateX(0) scale(1) rotate(0deg);
            opacity: 1;
        }
        .user-modal-box.closing {
            transform: translateY(120%) translateX(30px) scale(0.85) rotate(-6deg) !important;
            opacity: 0 !important;
            transition: transform 0.4s cubic-bezier(0.5, 0, 0.75, 0),
                        opacity 0.3s ease !important;
        }
        .user-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            color: #475569;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            line-height: 1;
        }
        .user-modal-close:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: rotate(90deg) scale(1.1);
            color: #1e293b;
        }
        .user-modal-avatar-wrap {
            position: relative;
            margin-bottom: 18px;
        }
        .user-modal-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 32px rgba(96, 165, 250, 0.35);
            display: block;
        }
        .user-modal-online-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
        }
        .user-modal-online-dot.online {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        .user-modal-online-dot.offline {
            background: #94a3b8;
        }
        .user-modal-name {
            font-size: 1.5em;
            font-weight: 800;
            color: #1e293b;
            margin: 0 0 4px;
            letter-spacing: 0.02em;
        }
        .user-modal-status {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 999px;
        }
        .user-modal-status.online {
            color: #15803d;
            background: rgba(34, 197, 94, 0.18);
        }
        .user-modal-status.offline {
            color: #64748b;
            background: rgba(148, 163, 184, 0.2);
        }
        .user-modal-bio-label {
            font-size: 12px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .user-modal-bio {
            font-size: 15px;
            color: #334155;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 160px;
            overflow-y: auto;
            padding: 0 8px;
        }
        .user-modal-bio.empty {
            color: #94a3b8;
            font-style: italic;
        }
        .user-modal-box::before {
            content: "";
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(ellipse, rgba(96, 165, 250, 0.3), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        @media (max-width: 640px) {
            .user-modal-box {
                padding: 28px 22px 22px;
            }
            .user-modal-avatar {
                width: 90px;
                height: 90px;
            }
            .user-modal-name {
                font-size: 1.3em;
            }
        }
    </style>

<div class="container" style="background: transparent; backdrop-filter: none; border: none; box-shadow: none;">
    <div class="userlist-wrap">
        <div class="userlist-card">
            <h1>用户列表</h1>
            <p class="userlist-desc">查看所有注册用户</p>
            <div class="online-count" id="onlineCount">
                <span class="online-count-dot"></span>
                <span id="onlineCountText">正在获取在线状态...</span>
            </div>

            <div id="userListBox" class="user-list-box"></div>
        </div>
    </div>
</div>

<!-- 用户详情弹窗 -->
<div class="user-modal-mask" id="userModalMask">
    <div class="user-modal-box" id="userModalBox" role="dialog" aria-modal="true">
        <button class="user-modal-close" id="userModalClose" aria-label="关闭">×</button>
        <div class="user-modal-avatar-wrap">
            <img class="user-modal-avatar" id="userModalAvatar" src="" alt="用户头像">
            <span class="user-modal-online-dot offline" id="userModalDot"></span>
        </div>
        <h3 class="user-modal-name" id="userModalName">用户名</h3>
        <span class="user-modal-status offline" id="userModalStatus">离线</span>
        <div class="user-modal-bio-label">个人简介</div>
        <div class="user-modal-bio" id="userModalBio">这个人很懒，什么都没写~</div>
    </div>
</div>

<footer>© 2026 QISH · </footer>

<script>
const userListBox = document.getElementById("userListBox");
const onlineCountText = document.getElementById("onlineCountText");

const defaultAvatar = "avatar.jpg";
let currentUser = null;
let onlineUserIds = new Set();


async function waitForQISH(ms) {
    ms = ms || 4000;
    const t0 = Date.now();
    while (!window.QISH || !QISH.updateAuthNav) {
        if (Date.now() - t0 > ms) break;
        await new Promise(function (r) { setTimeout(r, 30); });
    }
    return window.QISH;
}

async function updateAuthNav() {
    await waitForQISH();
    if (!window.QISH || !QISH.updateAuthNav || !supabase) return;
    const r = await QISH.updateAuthNav({ supabase });
    if (r && r.user) {
        currentUser = r.user;
    } else {
        currentUser = null;
    }
}

async function loadUserList() {
    userListBox.innerHTML = "";

    const { data, error } = await supabase
        .from("public_user_list")
        .select("user_id, nickname, avatar_url, bio")
        .order("created_at", { ascending: true });

    if (error) {
        userListBox.innerHTML = `<p class="empty-tip">加载用户失败：${error.message}</p>`;
        return;
    }

    if (!data || data.length === 0) {
        userListBox.innerHTML = `<p class="empty-tip">暂无注册用户</p>`;
        return;
    }

    for (const row of data) {
        const userItem = document.createElement("div");
        userItem.className = "user-item";
        userItem.dataset.userId = row.user_id;

        // 头像容器（含在线指示器）
        const avatarWrap = document.createElement("div");
        avatarWrap.className = "user-avatar-wrap";
        avatarWrap.style.cursor = "pointer";
        const avatar = document.createElement("img");
        avatar.className = "user-avatar";
        avatar.src = row.avatar_url || "avatar.jpg";
        avatar.alt = row.nickname || "用户头像";
        avatar.onerror = function () { this.src = "avatar.jpg"; };
        const indicator = document.createElement("span");
        indicator.className = "online-indicator " + (onlineUserIds.has(row.user_id) ? "online" : "offline");
        indicator.title = onlineUserIds.has(row.user_id) ? "在线" : "离线";
        avatarWrap.appendChild(avatar);
        avatarWrap.appendChild(indicator);
        // 点击头像弹出详情
        avatarWrap.addEventListener("click", () => {
            openUserModal(row);
        });

        const meta = document.createElement("div");
        meta.className = "user-meta";
        const name = document.createElement("div");
        name.className = "user-name";
        name.innerText = row.nickname || "匿名用户";
        meta.appendChild(name);
        if (row.bio) {
            const bio = document.createElement("div");
            bio.className = "user-bio";
            bio.innerText = row.bio;
            meta.appendChild(bio);
        }
        userItem.appendChild(avatarWrap);
        userItem.appendChild(meta);
        userListBox.appendChild(userItem);
    }
    updateOnlineCount();
}

// 更新所有用户项的在线状态
function refreshOnlineIndicators() {
    const items = userListBox.querySelectorAll(".user-item");
    items.forEach(item => {
        const userId = item.dataset.userId;
        const indicator = item.querySelector(".online-indicator");
        if (!indicator) return;
        if (onlineUserIds.has(userId)) {
            indicator.className = "online-indicator online";
            indicator.title = "在线";
        } else {
            indicator.className = "online-indicator offline";
            indicator.title = "离线";
        }
    });
    updateOnlineCount();
}

function updateOnlineCount() {
    if (!onlineCountText) return;
    const total = userListBox.querySelectorAll(".user-item").length;
    const online = onlineUserIds.size;
    if (total === 0) {
        onlineCountText.textContent = "暂无用户";
    } else {
        onlineCountText.textContent = `${online} 人在线 / 共 ${total} 人`;
    }
}

// 订阅 Presence 频道，实时更新在线状态
async function initPresenceListener() {
    if (!supabase) return;
    // 优先使用 common.js 已建立的频道状态
    if (window.QISH && typeof QISH.getOnlineUserIds === "function") {
        onlineUserIds = QISH.getOnlineUserIds();
        refreshOnlineIndicators();
    }
    // 监听自定义事件（common.js 在 presence sync 时派发）
    window.addEventListener("qish-presence-sync", (e) => {
        if (e.detail && e.detail.ids) {
            onlineUserIds = new Set(e.detail.ids);
            refreshOnlineIndicators();
        }
    });
    // 兜底：如果 common.js 未初始化成功，自己订阅一个频道监听
    setTimeout(() => {
        if (onlineUserIds.size === 0 && window.QISH && typeof QISH.getOnlineUserIds === "function") {
            onlineUserIds = QISH.getOnlineUserIds();
            refreshOnlineIndicators();
        }
    }, 1500);
}

// ========== 用户详情弹窗 ==========
const userModalMask = document.getElementById("userModalMask");
const userModalBox = document.getElementById("userModalBox");
const userModalAvatar = document.getElementById("userModalAvatar");
const userModalName = document.getElementById("userModalName");
const userModalBio = document.getElementById("userModalBio");
const userModalDot = document.getElementById("userModalDot");
const userModalStatus = document.getElementById("userModalStatus");
const userModalClose = document.getElementById("userModalClose");

let modalClosing = false;

function openUserModal(row) {
    if (!row || modalClosing) return;
    // 填充数据
    userModalAvatar.src = row.avatar_url || "avatar.jpg";
    userModalAvatar.onerror = function () { this.src = "avatar.jpg"; };
    userModalName.textContent = row.nickname || "匿名用户";
    if (row.bio && row.bio.trim()) {
        userModalBio.textContent = row.bio;
        userModalBio.classList.remove("empty");
    } else {
        userModalBio.textContent = "这个人很懒，什么都没写~";
        userModalBio.classList.add("empty");
    }
    // 在线状态
    const isOnline = onlineUserIds.has(row.user_id);
    if (isOnline) {
        userModalDot.className = "user-modal-online-dot online";
        userModalStatus.className = "user-modal-status online";
        userModalStatus.textContent = "在线";
    } else {
        userModalDot.className = "user-modal-online-dot offline";
        userModalStatus.className = "user-modal-status offline";
        userModalStatus.textContent = "离线";
    }
    // 重置关闭动画状态
    userModalBox.classList.remove("closing");
    // 显示（下一帧触发过渡动画）
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            userModalMask.classList.add("show");
        });
    });
    // 锁定背景滚动
    document.body.style.overflow = "hidden";
}

function closeUserModal() {
    if (!userModalMask.classList.contains("show") || modalClosing) return;
    modalClosing = true;
    userModalBox.classList.add("closing");
    userModalMask.classList.remove("show");
    setTimeout(() => {
        userModalBox.classList.remove("closing");
        modalClosing = false;
        document.body.style.overflow = "";
    }, 420);
}

// 关闭按钮
userModalClose.addEventListener("click", closeUserModal);
// 点击遮罩空白处关闭
userModalMask.addEventListener("click", (e) => {
    if (e.target === userModalMask) closeUserModal();
});
// Esc 关闭
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && userModalMask.classList.contains("show")) {
        closeUserModal();
    }
});

(async function init() {
    await updateAuthNav();
    await loadUserList();
    await initPresenceListener();
})();

supabase.auth.onAuthStateChange(() => {
    init();
});
</script>
