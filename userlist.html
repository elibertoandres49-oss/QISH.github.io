    <style>
    .user-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 20px;
    }
    .user-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 20px;
        text-align: center;
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
        position: relative;
    }
    .user-card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover); }


    .user-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
        border: 2px solid var(--card-border);
    }
    .user-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .user-bio { font-size: 12px; color: var(--text-sub); }
    .search-box {
        display: flex;
        gap: 10px;
        margin-top: 16px;
    }
    .search-box input { flex: 1; }
    .stats-bar {
        display: flex;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
    }
    .stat-pill {
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        font-size: 13px;
        font-weight: 600;
    }
    .stat-pill .num { color: var(--accent); font-size: 18px; margin-right: 4px; }

<script>
const SUPABASE_URL = "https://gmrzngjwwqftkwatrqcd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcnpuZ2p3d3FmdGt3YXRycWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM1NjMsImV4cCI6MjEwMjc0OTU2M30.iy-RrMQ-hg6-r0Y0RKkmxq3pBPbPmjkq2piifrcRh1M";
let sb = null;
(function initSb() {
    if (window.supabase && typeof window.supabase.createClient === "function") {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: "qish-auth-v1" }
        });
        window.supabaseClient = sb;
    } else {
        setTimeout(initSb, 80);
    }
})();

let allUsers = [];

function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderUsers(filter) {
    const grid = document.getElementById("userGrid");
    const f = (filter || "").toLowerCase().trim();
    const list = f ? allUsers.filter(u => (u.nickname || "").toLowerCase().includes(f)) : allUsers;
    grid.innerHTML = list.map(u => {
        const avatar = u.avatar_url || "avatar.jpg";
        return '<div class="user-card">' +
            '<img src="' + escapeHtml(avatar) + '" class="user-avatar" alt="">' +
            '<div class="user-name">' + escapeHtml(u.nickname || "匿名用户") + '</div>' +
            '<div class="user-bio">' + escapeHtml(u.bio || "") + '</div>' +
            '</div>';
    }).join("") || '<div style="grid-column:1/-1;text-align:center;color:var(--text-sub);padding:40px;">暂无用户</div>';
}

async function loadUsers() {
    const { data, error } = await sb.from("public_user_list").select("*").order("nickname");
    if (error) { console.error(error); return; }
    allUsers = data || [];
    document.getElementById("totalCount").textContent = allUsers.length;
    renderUsers();
}



document.getElementById("searchInput").addEventListener("input", e => renderUsers(e.target.value));

loadUsers();
</script>
