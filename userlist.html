<script>
const glow = document.getElementById('glow');
const sidePanel = document.getElementById('sidePanel');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closePanel');
const navAvatar = document.getElementById('navAvatar');
const navNickname = document.getElementById('navNickname');
const panelAvatar = document.getElementById("panelAvatar");
const panelUsername = document.getElementById("panelUsername");
const userListBox = document.getElementById("userListBox");

const defaultAvatar = "avatar.jpg";
let currentUser = null;

let mouseX = 0, mouseY = 0;
let currentX = 0, currentY = 0;
let velX = 0, velY = 0;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animate() {
    const dx = mouseX - currentX;
    const dy = mouseY - currentY;
    velX += dx * 0.12;
    velY += dy * 0.12;
    velX *= 0.78;
    velY *= 0.78;
    currentX += velX;
    currentY += velY;
    const speed = Math.sqrt(velX * velX + velY * velY);
    const stretch = Math.min(speed * 0.08, 1.8);
    const angle = Math.atan2(velY, velX) * (180 / Math.PI);
    glow.style.left = currentX + 'px';
    glow.style.top = currentY + 'px';
    glow.style.transform = `translate(-50%, -50%) rotate(${angle}deg) scaleX(${1 + stretch}) scaleY(${1 - stretch * 0.3})`;
    glow.style.borderRadius = stretch > 0.3 ? '40%' : '50%';
    requestAnimationFrame(animate);
}
animate();

navAvatar.addEventListener('click', () => {
    sidePanel.classList.add('active');
    overlay.classList.add('active');
    document.getElementById('rightImage').classList.add('active');
});

function closePanel() {
    sidePanel.classList.remove('active');
    overlay.classList.remove('active');
    document.getElementById('rightImage').classList.remove('active');
}
closeBtn.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

async function updateAuthNav() {
    const { data } = await supabase.auth.getSession();
    const session = data.session;
    const authNav = document.getElementById('auth-nav');
    const panelLinksBox = document.getElementById('panelLinksBox');

    if (session) {
        currentUser = session.user;
        const userEmail = currentUser.email;

        const { data: profile } = await supabase
            .from("public_user_list")
            .select("avatar_url, nickname")
            .eq("user_id", currentUser.id)
            .single();

        if (profile && profile.avatar_url) {
            navAvatar.src = profile.avatar_url;
            panelAvatar.src = profile.avatar_url;
        } else {
            navAvatar.src = defaultAvatar;
            panelAvatar.src = defaultAvatar;
        }

        const showNick = (profile && profile.nickname) ? profile.nickname : "匿名用户";
        navNickname.textContent = showNick;
        navNickname.style.display = "block";
        panelUsername.innerText = showNick;

        // 登录成功：导航栏只显示邮箱+退出登录，删掉登录注册
        authNav.innerHTML = `
            <span style="padding:8px 10px;color:#1e293b;font-weight:500;">${userEmail}</span>
            <button id="logoutBtn" style="
                background:rgba(255,255,255,0.3);
                border:none;
                border-radius:8px;
                padding:8px 14px;
                cursor:pointer;
                font-size:16px;
            ">退出登录</button>
        `;

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = "auth.html";
        });

        // 登录成功：侧边面板链接移除登录注册
        panelLinksBox.innerHTML = `
            <a href="index.html">首页</a>
            <a href="about.html">关于我</a>
            <a href="projects.html">我的项目</a>
            <a href="userlist.html">用户列表</a>
            <a href="profile.html">个人资料</a>
            <a href="./album.html">相册</a>
            <a href="chat.html">聊天室</a>
        `;

    } else {
        currentUser = null;
        navAvatar.src = defaultAvatar;
        panelAvatar.src = defaultAvatar;
        navNickname.style.display = "none";
        panelUsername.innerText = "QISH";
        // 未登录状态保留登录注册
        authNav.innerHTML = `<a href="auth.html">登录/注册</a>`;
        panelLinksBox.innerHTML = `
            <a href="index.html">首页</a>
            <a href="about.html">关于我</a>
            <a href="projects.html">我的项目</a>
            <a href="userlist.html">用户列表</a>
            <a href="profile.html">个人资料</a>
            <a href="./album.html">相册</a>
            <a href="chat.html">聊天室</a>
            <a href="auth.html">登录/注册</a>
        `;
    }
}

async function loadUserList() {
    userListBox.innerHTML = "";

    const { data, error } = await supabase
        .from("public_user_list")
        .select("user_id, nickname, avatar_url")
        .order("created_at", { ascending: true });

    if (error) {
        userListBox.innerHTML = `<p class="empty-tip">加载用户失败：${error.message}</p>`;
        return;
    }

    if (!data || data.length === 0) {
        userListBox.innerHTML = `<p class="empty-tip">暂无注册用户</p>`;
        return;
    }

    for (const row of data) {
        const userItem = document.createElement("div");
        userItem.className = "user-item";

        const avatar = document.createElement("img");
        avatar.className = "user-avatar";
        avatar.src = row.avatar_url || defaultAvatar;
        avatar.alt = row.nickname || "用户头像";

        const name = document.createElement("span");
        name.className = "user-name";
        name.innerText = row.nickname || "匿名用户";

        userItem.appendChild(avatar);
        userItem.appendChild(name);
        userListBox.appendChild(userItem);
    }
}

(async function init() {
    await updateAuthNav();
    await loadUserList();
})();

supabase.auth.onAuthStateChange(() => {
    init();
});
</script>
