<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maimai 铺面查询 - QISH</title>
    <link rel="icon" href="avatar.jpg">
    <script>
    (function(){try{var t=localStorage.getItem("qish_theme");document.documentElement.setAttribute("data-theme",(t==="light"||t==="dark"||t==="aqua"||t==="custom")?t:"aqua");}catch(e){document.documentElement.setAttribute("data-theme","aqua");}})();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
    <script src="common.js" defer></script>
    <style>
    .maimai-page .main-content { max-width: 1200px; margin: 0 auto; }
    .maimai-header {
        text-align: center;
        padding: 32px 20px 16px;
    }
    .maimai-title {
        font-size: 28px;
        font-weight: 900;
        color: var(--text-main);
        margin-bottom: 6px;
    }
    .maimai-subtitle {
        color: var(--text-sub);
        font-size: 14px;
        margin-bottom: 20px;
    }
    .maimai-search-bar {
        display: flex;
        gap: 10px;
        max-width: 600px;
        margin: 0 auto 16px;
    }
    .maimai-search-input {
        flex: 1;
        padding: 12px 18px;
        border-radius: 14px;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }
    .maimai-search-input:focus { border-color: var(--accent); }
    .maimai-search-btn {
        padding: 12px 24px;
        border-radius: 14px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
        flex-shrink: 0;
    }
    .maimai-search-btn:hover { opacity: 0.85; }
    .maimai-filter {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }
    .diff-btn {
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        color: var(--text-body);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .diff-btn:hover { border-color: var(--accent); }
    .diff-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
    }
    .diff-basic { color: #22c55e; }
    .diff-advanced { color: #3b82f6; }
    .diff-expert { color: #f59e0b; }
    .diff-master { color: #ef4444; }
    .diff-remaster { color: #a855f7; }
    .diff-btn.active.diff-basic { background: #22c55e; border-color: #22c55e; color: #fff; }
    .diff-btn.active.diff-advanced { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .diff-btn.active.diff-expert { background: #f59e0b; border-color: #f59e0b; color: #fff; }
    .diff-btn.active.diff-master { background: #ef4444; border-color: #ef4444; color: #fff; }
    .diff-btn.active.diff-remaster { background: #a855f7; border-color: #a855f7; color: #fff; }

    .song-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        padding: 0 20px 40px;
    }
    .song-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
    }
    .song-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(0,0,0,0.15);
        border-color: var(--accent);
    }
    .song-card-cover {
        width: 100%;
        height: 120px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 900;
        color: rgba(255,255,255,0.9);
        margin-bottom: 12px;
        overflow: hidden;
        position: relative;
    }
    .song-card-cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
    }
    .song-card-cover-text {
        position: relative;
        z-index: 2;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        display: none;
    }
    .song-card-designer {
        font-size: 11px;
        color: var(--text-sub);
        margin-bottom: 6px;
    }
    .song-card-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 6px;
    }
    .song-tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(255,255,255,0.1);
        color: var(--text-sub);
    }
    .loading-text {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px;
        color: var(--text-sub);
        font-size: 15px;
    }
    .song-card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .song-card-artist {
        font-size: 12px;
        color: var(--text-sub);
        margin-bottom: 10px;
    }
    .song-card-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }
    .mini-levels {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
    }
    .mini-level {
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        padding: 2px 5px;
        border-radius: 4px;
        min-width: 18px;
        text-align: center;
    }
    .diff-badge {
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
    }
    .diff-badge.basic { background: #22c55e; }
    .diff-badge.advanced { background: #3b82f6; }
    .diff-badge.expert { background: #f59e0b; }
    .diff-badge.master { background: #ef4444; }
    .diff-badge.remaster { background: #a855f7; }
    .song-level {
        font-size: 13px;
        font-weight: 800;
        color: var(--accent);
    }
    .song-bpm {
        font-size: 11px;
        color: var(--text-sub);
        margin-left: auto;
    }

    /* 预览模态框 */
    .chart-preview-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(10px);
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .chart-preview-overlay.active { display: flex; }
    .chart-preview-box {
        background: var(--card-bg-strong);
        border-radius: 24px;
        padding: 28px;
        max-width: 680px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
    }
    .chart-preview-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .chart-preview-header {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        align-items: flex-start;
    }
    .chart-preview-cover {
        width: 100px;
        height: 100px;
        border-radius: 12px;
        object-fit: cover;
        flex-shrink: 0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .chart-preview-text {
        flex: 1;
        min-width: 0;
    }
    .chart-preview-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 4px;
    }
    .chart-preview-artist {
        font-size: 13px;
        color: var(--text-sub);
        margin-bottom: 10px;
    }
    .chart-preview-info {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .chart-info-item {
        background: var(--accent-soft);
        padding: 6px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
    }
    .chart-canvas-wrap {
        width: 100%;
        aspect-ratio: 1;
        max-width: 400px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #1a1a2e;
        overflow: hidden;
        position: relative;
    }
    #chartCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }
    .chart-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 24px;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        padding: 0 10px;
    }
    .chart-progress-bar {
        flex: 1;
        height: 4px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        margin-right: 10px;
        overflow: hidden;
        position: relative;
    }
    .chart-progress-bar::after {
        content: "";
        position: absolute;
        left: 0; top: 0;
        height: 100%;
        width: var(--progress, 0%);
        background: var(--accent, #10b981);
        border-radius: 2px;
        transition: width 0.1s linear;
    }
    .chart-progress-text {
        color: rgba(255,255,255,0.8);
        font-size: 11px;
        font-weight: 600;
        min-width: 70px;
        text-align: right;
    }
    .chart-preview-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
    }
    .chart-btn {
        padding: 12px 28px;
        border-radius: 14px;
        border: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .chart-btn-download {
        background: var(--accent-grad);
        color: #fff;
    }
    .chart-btn-download:hover { opacity: 0.9; transform: translateY(-2px); }
    .chart-btn-play {
        background: var(--accent-soft);
        color: var(--accent);
    }
    .chart-btn-play:hover { background: var(--accent); color: #fff; }
    .empty-result {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-sub);
        font-size: 15px;
    }
    .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px 0;
    }
    .page-btn {
        padding: 8px 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text-main);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
    }
    .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .page-info {
        font-size: 13px;
        color: var(--text-sub);
        font-weight: 600;
        min-width: 60px;
        text-align: center;
    }
    </style>
</head>
<body class="maimai-page">
    <button class="nav-fab" id="navFab" aria-label="导航菜单"><img src="avatar.jpg" alt="菜单" id="navAvatar"></button>
    <div class="nav-fab-ring" id="navFabRing"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="avatar.jpg" alt="头像" class="sidebar-avatar" id="sidebarAvatar">
            <div class="sidebar-user-info">
                <div class="sidebar-username" id="sidebarUsername">QISH</div>
                <div class="sidebar-status" id="sidebarStatus">未登录</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-nav-label">导航</div>
            <a href="index.html">首页</a>
            <a href="about.html">关于我</a>
            <a href="timeline.html">个人历程</a>
            <a href="projects.html">我的项目</a>
            <a href="announce.html">公告</a>
            <a href="character.html">角色</a>
            <a href="chat.html">聊天室</a>
            <a href="album.html">成员相册</a>
            <a href="userlist.html">用户列表</a>
            <a href="profile.html">个人资料</a>
            <div class="sidebar-nav-label">账号</div>
            <a href="auth.html" id="sidebarAuthLink">登录/注册</a>
            <button class="sidebar-logout-btn" id="sidebarLogoutBtn" style="display:none;">退出登录</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mouse-glow" id="glow"></div>

    <main class="main-content">
        <div class="maimai-header">
            <div class="maimai-title">Maimai 铺面查询</div>
            <div class="maimai-subtitle">输入曲名搜索跳转 Maiviewer 播放 · 下方浏览官谱列表点击跳转</div>
            <div class="maimai-search-bar">
                <input type="text" class="maimai-search-input" id="searchInput" placeholder="输入曲名，回车跳转 Maiviewer 搜索...">
                <button class="maimai-search-btn" id="searchBtn">搜索</button>
            </div>
            <div class="maimai-filter" id="diffFilter">
                <button class="diff-btn active" data-diff="all">全部</button>
                <button class="diff-btn diff-basic" data-diff="basic">Basic</button>
                <button class="diff-btn diff-advanced" data-diff="advanced">Advanced</button>
                <button class="diff-btn diff-expert" data-diff="expert">Expert</button>
                <button class="diff-btn diff-master" data-diff="master">Master</button>
                <button class="diff-btn diff-remaster" data-diff="remaster">Re:MASTER</button>
            </div>
        </div>

        <div class="song-grid" id="songGrid"></div>
        <div class="empty-result" id="emptyResult" style="display:none;">没有找到匹配的曲目</div>
        <div class="pagination" id="pagination" style="display:none;">
            <button class="page-btn" id="prevPage">上一页</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button class="page-btn" id="nextPage">下一页</button>
        </div>
    </main>

<script>
// ========== 官谱数据源（diving-fish） ==========
const OFFICIAL_API = "https://www.diving-fish.com/api/maimaidxprober/music_data";
const CACHE_KEY = "qish_maimai_official_v1";
const CACHE_TTL = 24 * 60 * 60 * 1000;
const PAGE_SIZE = 48;

const DIFF_NAMES = ["Basic", "Advanced", "Expert", "Master", "Re:MASTER"];
const DIFF_COLORS = ["#22c55e", "#3b82f6", "#f59e0b", "#ef4444", "#a855f7"];

let allSongs = [];
let filteredSongs = [];
let currentPage = 1;
let currentFilter = "all";

// 标题生成稳定颜色（封面加载失败时用）
function colorFromTitle(title) {
    let hash = 0;
    for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
    const h = Math.abs(hash) % 360;
    return `hsl(${h}, 65%, 50%)`;
}

// 官谱封面 ID（5位补零，10001-11000减10000）
function getCoverUrl(songId) {
    let id = parseInt(songId);
    if (id > 10000 && id <= 11000) id -= 10000;
    return "https://www.diving-fish.com/covers/" + String(id).padStart(5, "0") + ".png";
}

// 跳转 maiviewer 播放该曲铺面
function openOnMaiviewer(song) {
    const q = encodeURIComponent(song.title);
    window.open("https://maiviewer.net/?q=" + q, "_blank");
}

function getMaxDiffIdx(song) {
    for (let i = song.level.length - 1; i >= 0; i--) {
        if (song.level[i]) return i;
    }
    return 0;
}

function getTotalNotes(song, idx) {
    if (!song.charts || !song.charts[idx]) return 0;
    return song.charts[idx].notes.reduce((a, b) => a + b, 0);
}

// ========== 加载官谱数据（带缓存） ==========
async function loadOfficialSongs() {
    const grid = document.getElementById("songGrid");
    grid.innerHTML = '<div class="loading-text">加载官谱数据中...</div>';

    try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, time } = JSON.parse(cached);
            if (Date.now() - time < CACHE_TTL && Array.isArray(data) && data.length > 100) {
                allSongs = data;
                applyFilter();
                return;
            }
        }
    } catch (e) {}

    try {
        const res = await fetch(OFFICIAL_API, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data) || data.length < 100) throw new Error("数据异常");
        allSongs = data;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data: allSongs, time: Date.now() })); } catch (e) {}
        applyFilter();
    } catch (e) {
        console.error("官谱加载失败:", e);
        grid.innerHTML = '<div class="loading-text">数据加载失败，请刷新重试</div>';
    }
}

// ========== 筛选（仅难度） ==========
function applyFilter() {
    filteredSongs = allSongs.filter(s => {
        if (currentFilter !== "all") {
            const idx = DIFF_NAMES.findIndex(d => d.toLowerCase().replace(/[:\s]/g, "") === currentFilter);
            if (idx < 0 || !s.level[idx]) return false;
        }
        return true;
    });
    filteredSongs.sort((a, b) => Math.max(...(b.ds || [0])) - Math.max(...(a.ds || [0])));
    currentPage = 1;
    renderPage();
}

// ========== 渲染当前页 ==========
function renderPage() {
    const grid = document.getElementById("songGrid");
    const empty = document.getElementById("emptyResult");
    const pag = document.getElementById("pagination");

    if (filteredSongs.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        pag.style.display = "none";
        return;
    }
    empty.style.display = "none";
    pag.style.display = "flex";

    const totalPages = Math.ceil(filteredSongs.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageSongs = filteredSongs.slice(start, start + PAGE_SIZE);

    grid.innerHTML = pageSongs.map(s => {
        const maxIdx = getMaxDiffIdx(s);
        const color = colorFromTitle(s.title);
        const bpm = s.basic_info?.bpm || "?";
        const notes = getTotalNotes(s, maxIdx);
        const levels = s.level.map((lv, i) =>
            lv ? `<span class="mini-level" style="background:${DIFF_COLORS[i]}">${lv}</span>` : ""
        ).join("");
        return `
        <div class="song-card" data-id="${s.id}">
            <div class="song-card-cover" style="background:linear-gradient(135deg,${color},${color}88);">
                <img src="${getCoverUrl(s.id)}" alt="" class="song-cover-img" loading="lazy"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <span class="song-card-cover-text">${s.title.substring(0, 2)}</span>
            </div>
            <div class="song-card-title">${s.title}</div>
            <div class="song-card-artist">${s.basic_info?.artist || "?"}</div>
            <div class="song-card-designer">${s.type === "DX" ? "DX" : "标准"} · ${bpm} BPM · ${notes} Note</div>
            <div class="song-card-meta"><div class="mini-levels">${levels}</div></div>
        </div>`;
    }).join("");

    grid.querySelectorAll(".song-card").forEach(card => {
        card.addEventListener("click", () => {
            const id = card.dataset.id;
            const song = allSongs.find(s => String(s.id) === id);
            if (song) openOnMaiviewer(song);
        });
    });

    document.getElementById("pageInfo").textContent = `${currentPage} / ${totalPages}`;
    document.getElementById("prevPage").disabled = currentPage <= 1;
    document.getElementById("nextPage").disabled = currentPage >= totalPages;
}

// ========== 事件绑定 ==========
// 搜索：回车或点击按钮直接跳转 maiviewer
function jumpToMaiviewer() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) return;
    window.open("https://maiviewer.net/?q=" + encodeURIComponent(q), "_blank");
}
document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") jumpToMaiviewer();
});
document.getElementById("searchBtn").addEventListener("click", jumpToMaiviewer);

document.getElementById("diffFilter").addEventListener("click", (e) => {
    if (!e.target.classList.contains("diff-btn")) return;
    document.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.diff;
    applyFilter();
});

document.getElementById("prevPage").addEventListener("click", () => {
    if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
});
document.getElementById("nextPage").addEventListener("click", () => {
    const total = Math.ceil(filteredSongs.length / PAGE_SIZE);
    if (currentPage < total) { currentPage++; renderPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

// 初始化
loadOfficialSongs();
</script>
</body>
</html>
