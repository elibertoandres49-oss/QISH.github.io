<script>
// ========== 合成大千世游戏 ==========
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // 水果等级配置（从小到大）
    const FRUITS = [
        { radius: 14, color: '#8b5cf6', score: 1 },
        { radius: 17, color: '#ef4444', score: 3 },
        { radius: 22, color: '#f97316', score: 6 },
        { radius: 26, color: '#eab308', score: 10 },
        { radius: 30, color: '#84cc16', score: 15 },
        { radius: 35, color: '#dc2626', score: 21 },
        { radius: 40, color: '#fb7185', score: 28 },
        { radius: 46, color: '#f59e0b', score: 36 },
        { radius: 52, color: '#92400e', score: 45 },
        { radius: 58, color: '#a3e635', score: 55 },
        { radius: 66, color: '#22c55e', score: 66 }
    ];

    const GRAVITY = 0.35;
    const BOUNCE = 0.3;
    const FRICTION = 0.99;
    const WALL_BOUNCE = 0.4;
    const DANGER_LINE = 100;
    const DROP_ZONE = 60;

    let fruits = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('watermelon_best') || '0');
    let currentLevel = 0;
    let nextLevel = 0;
    let dropX = W / 2;
    let canDrop = true;
    let gameOver = false;
    let dangerTimer = 0;
    let rafId = null;

    document.getElementById('bestValue').textContent = best;

    function randomLevel() {
        const r = Math.random();
        if (r < 0.35) return 0;
        if (r < 0.6) return 1;
        if (r < 0.78) return 2;
        if (r < 0.9) return 3;
        if (r < 0.97) return 4;
        return 5;
    }

    class Fruit {
        constructor(x, y, level) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.level = level;
            this.radius = FRUITS[level].radius;
            this.mass = this.radius * this.radius;
            this.merged = false;
            this.dropTime = Date.now();
        }

        update() {
            this.vy += GRAVITY;
            this.vx *= FRICTION;
            this.x += this.vx;
            this.y += this.vy;

            // 左右墙壁
            if (this.x - this.radius < 0) {
                this.x = this.radius;
                this.vx = Math.abs(this.vx) * WALL_BOUNCE;
            } else if (this.x + this.radius > W) {
                this.x = W - this.radius;
                this.vx = -Math.abs(this.vx) * WALL_BOUNCE;
            }

            // 底部
            if (this.y + this.radius > H) {
                this.y = H - this.radius;
                this.vy = -Math.abs(this.vy) * BOUNCE;
                if (Math.abs(this.vy) < 1) this.vy = 0;
                this.vx *= 0.95;
            }
        }

        draw() {
            const f = FRUITS[this.level];
            // 阴影
            ctx.beginPath();
            ctx.arc(this.x + 2, this.y + 3, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fill();
            // 单一颜色填充
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = f.color;
            ctx.fill();
            // 边框
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function checkCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < a.radius + b.radius;
    }

    function resolveCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist === 0) return;

        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = a.radius + b.radius - dist;
        const totalMass = a.mass + b.mass;

        a.x -= nx * overlap * (b.mass / totalMass);
        a.y -= ny * overlap * (b.mass / totalMass);
        b.x += nx * overlap * (a.mass / totalMass);
        b.y += ny * overlap * (a.mass / totalMass);

        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const velAlongNormal = dvx * nx + dvy * ny;
        if (velAlongNormal > 0) return;

        const restitution = 0.2;
        const impulse = -(1 + restitution) * velAlongNormal / (1 / a.mass + 1 / b.mass);
        a.vx -= impulse * nx / a.mass;
        a.vy -= impulse * ny / a.mass;
        b.vx += impulse * nx / b.mass;
        b.vy += impulse * ny / b.mass;
    }

    function tryMerge(a, b) {
        if (a.level !== b.level || a.merged || b.merged) return false;
        if (a.level >= FRUITS.length - 1) return false;

        a.merged = true;
        b.merged = true;

        const nx = (a.x + b.x) / 2;
        const ny = (a.y + b.y) / 2;
        const newLevel = a.level + 1;
        const newFruit = new Fruit(nx, ny, newLevel);
        newFruit.vy = -2;
        fruits.push(newFruit);

        score += FRUITS[newLevel].score;
        updateScore();
        return true;
    }

    function updateScore() {
        document.getElementById('scoreValue').textContent = score;
        if (score > best) {
            best = score;
            localStorage.setItem('watermelon_best', best);
            document.getElementById('bestValue').textContent = best;
        }
    }

    function updateNext() {
        const el = document.getElementById('nextFruit');
        const f = FRUITS[nextLevel];
        el.style.background = f.color;
        el.style.width = (f.radius * 2) + 'px';
        el.style.height = (f.radius * 2) + 'px';
        el.style.borderRadius = '50%';
    }

    function dropFruit() {
        if (!canDrop || gameOver) return;
        const f = new Fruit(dropX, DROP_ZONE, currentLevel);
        fruits.push(f);
        canDrop = false;
        setTimeout(() => { canDrop = true; }, 300);

        currentLevel = nextLevel;
        nextLevel = randomLevel();
        updateNext();
    }

    function checkGameOver() {
        for (const f of fruits) {
            if (Date.now() - f.dropTime > 1500 && f.y - f.radius < DANGER_LINE && f.vy < 1) {
                return true;
            }
        }
        return false;
    }

    function endGame() {
        gameOver = true;
        document.getElementById('overlayTitle').textContent = '游戏结束';
        document.getElementById('overlayScore').textContent = '得分：' + score;
        document.getElementById('gameOverlay').classList.add('show');
    }

    function gameLoop() {
        if (gameOver) return;

        // 更新
        for (const f of fruits) f.update();

        // 碰撞检测和合成
        for (let i = 0; i < fruits.length; i++) {
            for (let j = i + 1; j < fruits.length; j++) {
                if (fruits[i].merged || fruits[j].merged) continue;
                if (checkCollision(fruits[i], fruits[j])) {
                    if (!tryMerge(fruits[i], fruits[j])) {
                        resolveCollision(fruits[i], fruits[j]);
                    }
                }
            }
        }

        // 移除已合成的
        fruits = fruits.filter(f => !f.merged);

        // 游戏结束检测
        if (checkGameOver()) {
            dangerTimer++;
            if (dangerTimer > 60) {
                endGame();
                return;
            }
        } else {
            dangerTimer = 0;
        }

        // 渲染
        ctx.clearRect(0, 0, W, H);

        // 危险线
        ctx.strokeStyle = 'rgba(239,68,68,0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(0, DANGER_LINE);
        ctx.lineTo(W, DANGER_LINE);
        ctx.stroke();
        ctx.setLineDash([]);

        // 水果
        for (const f of fruits) f.draw();

        // 预览水果
        if (canDrop && !gameOver) {
            const f = FRUITS[currentLevel];
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(dropX, DROP_ZONE, f.radius, 0, Math.PI * 2);
            ctx.fillStyle = f.color;
            ctx.fill();
            ctx.globalAlpha = 1;

            // 引导线
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(dropX, DROP_ZONE + f.radius);
            ctx.lineTo(dropX, H);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        rafId = requestAnimationFrame(gameLoop);
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return (clientX - rect.left) * scaleX;
    }

    canvas.addEventListener('mousemove', (e) => {
        if (gameOver) return;
        dropX = Math.max(FRUITS[currentLevel].radius, Math.min(W - FRUITS[currentLevel].radius, getPos(e)));
    });

    canvas.addEventListener('click', (e) => {
        if (gameOver) return;
        dropX = Math.max(FRUITS[currentLevel].radius, Math.min(W - FRUITS[currentLevel].radius, getPos(e)));
        dropFruit();
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (gameOver) return;
        dropX = Math.max(FRUITS[currentLevel].radius, Math.min(W - FRUITS[currentLevel].radius, getPos(e)));
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (gameOver) return;
        dropFruit();
    });

    window.restartGame = function() {
        fruits = [];
        score = 0;
        gameOver = false;
        dangerTimer = 0;
        canDrop = true;
        currentLevel = randomLevel();
        nextLevel = randomLevel();
        dropX = W / 2;
        updateScore();
        updateNext();
        document.getElementById('gameOverlay').classList.remove('show');
        if (rafId) cancelAnimationFrame(rafId);
        gameLoop();
    };

    // 初始化
    currentLevel = randomLevel();
    nextLevel = randomLevel();
    updateNext();
    gameLoop();
})();
</script>
