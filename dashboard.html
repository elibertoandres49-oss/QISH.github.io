<script>
// ========== 全局数据缓存 ==========
let _dashDaily = [];
let _dashDevices = {};

// ========== 等待 Supabase 就绪 ==========
function waitForSb(cb, tries) {
    tries = tries || 0;
    const sb = window.supabaseClient;
    if (sb && typeof sb.from === 'function') { cb(sb); return; }
    if (tries > 60) { cb(null); return; }
    setTimeout(() => waitForSb(cb, tries + 1), 100);
}

// ========== 折线图绘制（接受日访问数据） ==========
function drawLineChart(daily) {
    const canvas = document.getElementById('lineChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const padL = 36, padR = 16, padT = 16, padB = 28;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const data = daily && daily.length ? daily : [{label:'--',value:0}];
    const maxVal = Math.max.apply(null, data.map(function(d){return d.value;}).concat([1])) * 1.15;

    function getX(i) { return padL + (data.length <= 1 ? chartW/2 : (i / (data.length - 1)) * chartW); }
    function getY(v) { return padT + chartH - (v / maxVal) * chartH; }

    ctx.strokeStyle = 'rgba(179, 136, 255, 0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const y = padT + (i / 4) * chartH;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
    }

    ctx.fillStyle = '#b0a3c8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    data.forEach(function(d, i) { ctx.fillText(d.label, getX(i), H - 8); });

    ctx.beginPath();
    ctx.moveTo(getX(0), getY(data[0].value));
    for (let i = 1; i < data.length; i++) {
        const xc = (getX(i - 1) + getX(i)) / 2;
        const yc = (getY(data[i - 1].value) + getY(data[i].value)) / 2;
        ctx.quadraticCurveTo(getX(i - 1), getY(data[i - 1].value), xc, yc);
    }
    ctx.lineTo(getX(data.length - 1), getY(data[data.length - 1].value));
    ctx.lineTo(getX(data.length - 1), padT + chartH);
    ctx.lineTo(getX(0), padT + chartH);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
    grad.addColorStop(0, 'rgba(179, 136, 255, 0.35)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(getX(0), getY(data[0].value));
    for (let i = 1; i < data.length; i++) {
        const xc = (getX(i - 1) + getX(i)) / 2;
        const yc = (getY(data[i - 1].value) + getY(data[i].value)) / 2;
        ctx.quadraticCurveTo(getX(i - 1), getY(data[i - 1].value), xc, yc);
    }
    ctx.lineTo(getX(data.length - 1), getY(data[data.length - 1].value));
    ctx.strokeStyle = '#b388ff';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    data.forEach(function(d, i) {
        ctx.beginPath();
        ctx.arc(getX(i), getY(d.value), 3, 0, Math.PI * 2);
        ctx.fillStyle = '#b388ff';
        ctx.fill();
    });
}

// ========== 饼图绘制（接受设备分布数据） ==========
function drawPieChart(devices) {
    const canvas = document.getElementById('pieChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 - 6;

    const entries = Object.entries(devices || {});
    const total = entries.reduce(function(s, x) { return s + x[1]; }, 0);
    const colors = ['#b388ff', '#f48fb1', '#ffb74d', '#81c784', '#64b5f6', '#ff8a65'];

    if (total === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#e0d8f0';
        ctx.fill();
    } else {
        let startAngle = -Math.PI / 2;
        entries.forEach(function(item, idx) {
            const name = item[0], val = item[1];
            const angle = (val / total) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, startAngle + angle);
            ctx.closePath();
            ctx.fillStyle = colors[idx % colors.length];
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
            startAngle += angle;
        });
    }

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();

    const legendEl = document.getElementById('pieLegend');
    if (legendEl) {
        if (total === 0) {
            legendEl.innerHTML = '<div class="dash-pie-row"><span style="color:#b0a3c8;">暂无数据</span></div>';
        } else {
            legendEl.innerHTML = entries.map(function(item, idx) {
                const name = item[0], val = item[1];
                const pct = ((val / total) * 100).toFixed(1);
                const label = name === 'desktop' ? '桌面端' : name === 'mobile' ? '移动端' : name === 'tablet' ? '平板' : name;
                return '<div class="dash-pie-row"><div class="dash-pie-row-left"><span class="dash-legend-dot" style="background:' + colors[idx % colors.length] + '"></span>' + label + '</div><span class="dash-pie-row-val">' + pct + '%</span></div>';
            }).join('');
        }
    }
}

// ========== 加载实际数据 ==========
async function loadDashboardData() {
    waitForSb(async function(sb) {
        if (!sb) {
            ['statTotal','statToday','statUnique','statUsers'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.textContent = '0';
            });
            drawLineChart([]);
            drawPieChart({});
            return;
        }
        try {
            var tenDaysAgo = new Date();
            tenDaysAgo.setDate(tenDaysAgo.getDate() - 9);
            tenDaysAgo.setHours(0, 0, 0, 0);
            var fetchStats = (window.QISH && window.QISH.fetchVisitStats)
                ? window.QISH.fetchVisitStats(sb)
                : Promise.resolve({ total: 0, today: 0, uniqueToday: 0, devices: {}, pages: {} });
            var results = await Promise.all([
                fetchStats,
                sb.from('public_user_list').select('*', { count: 'exact', head: true }),
                sb.from('public_site_visits').select('created_at').gte('created_at', tenDaysAgo.toISOString())
            ]);
            var stats = results[0], userRes = results[1], visitRes = results[2];
            document.getElementById('statTotal').textContent = (stats.total || 0).toLocaleString();
            document.getElementById('statToday').textContent = (stats.today || 0).toLocaleString();
            document.getElementById('statUnique').textContent = (stats.uniqueToday || 0).toLocaleString();
            document.getElementById('statUsers').textContent = (userRes.count || 0).toLocaleString();
            var visitRows = visitRes.data || [];
            var dailyMap = {}, labels = [];
            for (var i = 9; i >= 0; i--) {
                var d = new Date();
                d.setDate(d.getDate() - i);
                var key = d.toISOString().slice(0, 10);
                var label = (d.getMonth() + 1) + '/' + d.getDate();
                dailyMap[key] = 0;
                labels.push({ key: key, label: label });
            }
            visitRows.forEach(function(r) {
                var key = new Date(r.created_at).toISOString().slice(0, 10);
                if (dailyMap[key] !== undefined) dailyMap[key]++;
            });
            _dashDaily = labels.map(function(l) { return { label: l.label, value: dailyMap[l.key] }; });
            drawLineChart(_dashDaily);
            _dashDevices = stats.devices || {};
            drawPieChart(_dashDevices);
            var pages = stats.pages || {};
            var totalVisits = Object.values(pages).reduce(function(s, v) { return s + v; }, 0) || 1;
            var sortedPages = Object.entries(pages).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 8);
            var tbody = document.getElementById('pagesTableBody');
            if (tbody) {
                if (sortedPages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#b0a3c8;">暂无数据</td></tr>';
                } else {
                    tbody.innerHTML = sortedPages.map(function(item) {
                        var page = item[0], count = item[1];
                        var pct = ((count / totalVisits) * 100).toFixed(1);
                        var pageName = page.replace('.html', '') || 'index';
                        return '<tr><td>' + pageName + '</td><td>' + count.toLocaleString() + '</td><td><span class="dash-growth up">' + pct + '%</span></td></tr>';
                    }).join('');
                }
            }
        } catch (e) {
            console.warn('[Dashboard] data load failed', e);
        }
    });
}

function toggleTodo(el) {
    el.classList.toggle('checked');
    el.closest('.dash-todo-item').classList.toggle('done');
}
function delTodo(el) {
    el.closest('.dash-todo-item').remove();
}
function addTodo() {
    const text = prompt('请输入任务内容：');
    if (!text || !text.trim()) return;
    const ul = document.getElementById('todoList');
    const li = document.createElement('li');
    li.className = 'dash-todo-item';
    li.innerHTML = '<div class="dash-todo-check" onclick="toggleTodo(this)"></div><span class="dash-todo-text">' + text.trim() + '</span><span class="dash-todo-priority mid">中优先级</span><button class="dash-todo-del" onclick="delTodo(this)">🗑</button>';
    ul.appendChild(li);
}

// ========== 初始化 ==========
window.addEventListener('load', function() {
    loadDashboardData();
});
window.addEventListener('resize', function() {
    if (_dashDaily.length) drawLineChart(_dashDaily);
    if (Object.keys(_dashDevices).length) drawPieChart(_dashDevices);
});
</script>
