<div class="mouse-glow" id="glow"></div>
<nav>
    <div class="nav-avatar-area">
        <img src="avatar.jpg" alt="头像" class="nav-avatar" id="navAvatar">
        <span class="nav-nickname" id="navNickname" style="display: none;"></span>
    </div>
    <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="projects.html">项目</a>
        <a href="userlist.html">用户列表</a>
        <a href="profile.html">个人资料</a>
        <a href="./album.html">相册</a>
        <a href="chat.html">聊天室</a>
        <span id="auth-nav">
            <a href="auth.html">登录/注册</a>
        </span>
    </div>
</nav>
<div class="container" style="background: transparent; backdrop-filter: none; border: none; box-shadow: none;">
    <div class="profile-wrap">
        <div class="profile-card">
            <h1>个人资料</h1>
            <p class="profile-desc">修改你的昵称与头像</p>
            <img id="avatarPreview" src="avatar.jpg" alt="头像预览" class="profile-avatar-preview">
            <div class="form-item">
                <label>上传头像</label>
                <input type="file" id="avatarFile" accept="image/*">
            </div>
            <div class="form-item">
                <label>昵称</label>
                <input type="text" id="nicknameInput" placeholder="设置你的昵称">
            </div>
            <div class="form-item">
                <label>个人简介</label>
                <textarea id="bioInput" rows="3" maxlength="120" placeholder="写一句介绍自己吧（最多120字）" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.25);resize:vertical;font-family:inherit;font-size:14px;color:#1e293b;box-sizing:border-box;"></textarea>
                <small id="bioCount" style="color:#64748b;font-size:12px;">0 / 120</small>
            </div>
            <div class="btn-group">
                <button id="saveBtn" class="btn-primary">保存修改</button>
                <button id="resetBtn" class="btn-secondary">重置</button>
            </div>
            <div class="msg-box" id="msgBox"></div>
        </div>
    </div>
</div>
<footer>© 2026 QISH · </footer>
<script>
const glow = document.getElementById('glow');
const sidePanel = document.getElementById('sidePanel');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closePanel');
const navAvatar = document.getElementById('navAvatar');
const navNickname = document.getElementById('navNickname');
const panelAvatar = document.getElementById("panelAvatar");
const panelUsername = document.getElementById("panelUsername");
const defaultAvatar = "avatar.jpg";
const avatarPreview = document.getElementById("avatarPreview");
const avatarFile = document.getElementById("avatarFile");
const nicknameInput = document.getElementById("nicknameInput");
const saveBtn = document.getElementById("saveBtn");
const resetBtn = document.getElementById("resetBtn");
const msgBox = document.getElementById("msgBox");
let currentUser = null;
// 鼠标光效与侧栏由 common.js 统一处理

async function waitForQISH(ms) {
    ms = ms || 5000;
    const t0 = Date.now();
    while (!window.QISH || !QISH.updateAuthNav) {
        if (Date.now() - t0 > ms) break;
        await new Promise(function (r) { setTimeout(r, 30); });
    }
    return window.QISH;
}
async function updateAuthNav() {
    await waitForQISH();
    const client = window.supabaseClient || supabase;
    if (!window.QISH || !QISH.updateAuthNav) {
        console.warn("QISH 未加载，无法同步登录状态");
        return;
    }
    if (!client) {
        console.warn("Supabase 未初始化");
        return;
    }
    const r = await QISH.updateAuthNav({ supabase: client });
    if (r && r.user) {
        currentUser = r.user;
        return;
    }
    // 再确认一次 session，避免误判
    try {
        const { data } = await client.auth.getSession();
        if (data && data.session && data.session.user) {
            currentUser = data.session.user;
            await QISH.updateAuthNav({ supabase: client });
            return;
        }
    } catch (e) {
        console.warn(e);
    }
    currentUser = null;
    window.location.replace("auth.html");
}
window.updateAuthNav = updateAuthNav;


async function loadMyProfile() {
    if (!currentUser) return;
    const { data, error } = await supabase
        .from("public_user_list")
        .select("nickname, avatar_url, bio")
        .eq("user_id", currentUser.id)
        .single();
    if (!error && data) {
        nicknameInput.value = data.nickname || "";
        const bioInput = document.getElementById("bioInput");
        if (bioInput) {
            bioInput.value = data.bio || "";
            const cnt = document.getElementById("bioCount");
            if (cnt) cnt.textContent = (bioInput.value.length) + " / 120";
        }
        if (data.avatar_url) {
            avatarPreview.src = data.avatar_url + '?' + Date.now();
        } else {
            avatarPreview.src = defaultAvatar;
        }
    }
}
avatarFile.onchange = function (e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
            avatarPreview.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
};
saveBtn.onclick = async function () {
    msgBox.innerText = "";
    if (!currentUser) {
        msgBox.innerText = "请先登录";
        msgBox.style.color = "red";
        return;
    }
    let avatarUrl = null;
    const file = avatarFile.files[0];
    if (file) {
        const fileExt = file.name.split('.').pop();
        const filePath = `avatars/${currentUser.id}.${fileExt}`;
        const { error: uploadErr } = await supabase.storage.from("avatar_bucket").upload(filePath, file, {
            cacheControl: "3600",
            upsert: true
        });
        if (uploadErr) {
            msgBox.innerText = "头像上传失败：" + uploadErr.message;
            msgBox.style.color = "red";
            return;
        }
        const { data: publicUrlData } = supabase.storage.from("avatar_bucket").getPublicUrl(filePath);
        avatarUrl = publicUrlData.publicUrl;
    }
    const bioInput = document.getElementById("bioInput");
    const updateObj = {
        nickname: nicknameInput.value.trim(),
        bio: bioInput ? bioInput.value.trim().slice(0, 120) : ""
    };
    if (avatarUrl) {
        updateObj.avatar_url = avatarUrl;
    }
    const { error } = await supabase
        .from("public_user_list")
        .update(updateObj)
        .eq("user_id", currentUser.id);
    if (error) {
        msgBox.innerText = "保存失败：" + error.message;
        msgBox.style.color = "red";
    } else {
        msgBox.innerText = "✅资料保存成功！";
        msgBox.style.color = "green";
        await loadMyProfile();
        await updateAuthNav();
    }
};
const bioInputEl = document.getElementById("bioInput");
if (bioInputEl) {
    bioInputEl.addEventListener("input", () => {
        const cnt = document.getElementById("bioCount");
        if (cnt) cnt.textContent = bioInputEl.value.length + " / 120";
    });
}
resetBtn.onclick = async function () {
    avatarFile.value = "";
    msgBox.innerText = "";
    await loadMyProfile();
};
(async function init() {
    await waitForQISH();
    const client = window.supabaseClient || supabase;
    if (!client) {
        console.warn("profile: no supabase client");
        return;
    }
    await updateAuthNav();
    if (currentUser) {
        await loadMyProfile();
    }
    client.auth.onAuthStateChange(async function (event) {
        if (event === "INITIAL_SESSION") return;
        await waitForQISH();
        await updateAuthNav();
        if (currentUser) await loadMyProfile();
    });
})();
</script>
</body>
