    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
    (function(){try{var t=localStorage.getItem("qish_theme");document.documentElement.setAttribute("data-theme",(t==="light"||t==="dark"||t==="aqua"||t==="custom")?t:"aqua");}catch(e){document.documentElement.setAttribute("data-theme","aqua");}})();
    </script>
    <style>
    /* 2.5D 角色页面专属样式 */
    .char25-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px 40px;
        position: relative;
        overflow: hidden;
    }

    /* 背景氛围 */
    .char25-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(ellipse 60% 50% at 30% 40%, rgba(91,168,160,0.15), transparent),
            radial-gradient(ellipse 50% 60% at 70% 60%, rgba(184,160,216,0.12), transparent),
            radial-gradient(ellipse 40% 40% at 50% 80%, rgba(232,160,184,0.1), transparent);
        pointer-events: none;
    }

    /* 浮动粒子 */
    .char25-particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
    }
    .char25-particle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 70%);
        animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* 3D 舞台 */
    .char25-stage {
        position: relative;
        z-index: 2;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        width: min(420px, 80vw);
        aspect-ratio: 3/4;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 角色容器（3D 变换） */
    .char25-container {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.15s ease-out;
        will-change: transform;
    }

    /* 角色阴影层（随倾斜偏移，增强立体感） */
    .char25-shadow {
        position: absolute;
        bottom: -10%;
        left: 50%;
        transform: translateX(-50%) rotateX(90deg);
        width: 70%;
        height: 40px;
        background: radial-gradient(ellipse, rgba(0,0,0,0.25), transparent 70%);
        filter: blur(8px);
        transition: all 0.15s ease-out;
        z-index: -1;
    }

    /* 角色光晕层 */
    .char25-glow {
        position: absolute;
        inset: -10%;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, rgba(91,168,160,0.2), transparent 60%);
        filter: blur(30px);
        z-index: -1;
        transition: all 0.2s ease-out;
        transform: translateZ(-50px);
    }

    /* 角色图片层（匹配角色图比例，确保眼睛定位精确） */
    .char25-img-wrap {
        position: relative;
        width: 100%;
        max-height: 100%;
        aspect-ratio: 1199 / 1454;
        margin: 0 auto;
        transform-style: preserve-3d;
    }
    .char25-img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
        transition: filter 0.2s ease-out;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    /* 眼睛追踪层 */
    .char25-eyes {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transform-style: preserve-3d;
    }
    /* 眼眶（眼球可移动范围） */
    .char25-eye-socket {
        position: absolute;
        left: 21.5%;
        top: 50.5%;
        width: 32.0%;
        height: 10.0%;
        transform: translateZ(30px);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* 真实眼球图片（在眼眶内随鼠标移动） */
    .char25-eye-img {
        width: 40%;
        aspect-ratio: 701 / 715;
        object-fit: contain;
        transition: transform 0.1s ease-out;
        will-change: transform;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }
    /* 眼睛光晕 */
    .char25-eye-glow {
        position: absolute;
        width: 60%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(147,197,253,0.3), transparent 70%);
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    .char25-eye-socket.active .char25-eye-glow {
        opacity: 1;
    }

    /* 角色名字/标题 */
    .char25-title {
        position: relative;
        z-index: 2;
        text-align: center;
        margin-top: 24px;
    }
    .char25-name {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 4px;
        letter-spacing: 2px;
    }
    .char25-desc {
        font-size: 13px;
        color: var(--text-sub);
    }

    /* 提示文字 */
    .char25-hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 12px;
        color: var(--text-sub);
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        padding: 8px 20px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        opacity: 0.7;
        transition: opacity 0.3s;
    }
    .char25-hint:hover { opacity: 1; }

    /* 呼吸动画 */
    .char25-breath {
        animation: charBreath 4s ease-in-out infinite;
    }
    @keyframes charBreath {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    /* 闲置时轻微晃动 */
    .char25-idle {
        animation: charIdle 6s ease-in-out infinite;
    }
    @keyframes charIdle {
        0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
        25% { transform: rotateY(-3deg) rotateX(1deg); }
        75% { transform: rotateY(3deg) rotateX(-1deg); }
    }

    /* 触摸设备适配 */
    @media (hover: none) and (pointer: coarse) {
        .char25-stage {
            width: min(320px, 85vw);
        }
        .char25-hint { display: none; }
    }
    @media (max-width: 480px) {
        .char25-stage {
            width: min(280px, 85vw);
        }
        .char25-name { font-size: 22px; }
    }
    </style>
</head>

    <main class="main-content" style="padding:0;min-height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;">
        <div class="char25-page">
            <div class="char25-stage" id="stage">
                <div class="char25-container char25-breath" id="charContainer">
                    <div class="char25-glow" id="charGlow"></div>
                    <div class="char25-shadow" id="charShadow"></div>

                            <div class="char25-eye-socket" id="eyeSocket">

    <div class="char25-hint">移动鼠标 → 头部晃动 · 眼睛追踪</div>

<script src="common.js" defer></script>
<script>
// ========== 2.5D 角色互动 ==========
(function() {
    const stage = document.getElementById('stage');
    const container = document.getElementById('charContainer');
    const glow = document.getElementById('charGlow');
    const shadow = document.getElementById('charShadow');
    const eyeImg = document.getElementById('eyeImg');
    const eyeSocket = document.getElementById('eyeSocket');
    const particles = document.getElementById('particles');

    if (!stage || !container) return;

    // 鼠标位置（归一化 -1 到 1）
    let mouseX = 0, mouseY = 0;
    // 当前旋转角度（平滑插值）
    let curRotX = 0, curRotY = 0;
    let targetRotX = 0, targetRotY = 0;
    // 眼睛当前偏移（平滑插值）
    let curEyeX = 0, curEyeY = 0;
    let targetEyeX = 0, targetEyeY = 0;
    // 是否有鼠标交互
    let hasInteraction = false;
    let idleTimer = null;

    // 最大倾斜角度
    const MAX_TILT_X = 12;  // 上下
    const MAX_TILT_Y = 18;  // 左右
    // 眼球在眼眶内最大偏移（百分比，相对于眼球自身尺寸）
    const EYE_MAX_OFFSET_X = 45;  // 水平移动大
    const EYE_MAX_OFFSET_Y = 10;  // 垂直移动小（眼眶扁）

    // 创建浮动粒子
    function createParticles() {
        if (!particles) return;
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'char25-particle';
            const size = 2 + Math.random() * 6;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            particles.appendChild(p);
        }
    }
    createParticles();

    // 鼠标移动处理
    function onMouseMove(e) {
        hasInteraction = true;
        clearTimeout(idleTimer);

        const rect = stage.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        // 归一化到 -1 ~ 1
        mouseX = (e.clientX - cx) / (rect.width / 2);
        mouseY = (e.clientY - cy) / (rect.height / 2);
        mouseX = Math.max(-1, Math.min(1, mouseX));
        mouseY = Math.max(-1, Math.min(1, mouseY));

        // 目标旋转角度
        targetRotY = mouseX * MAX_TILT_Y;
        targetRotX = -mouseY * MAX_TILT_X;

        // 眼球在眼眶内偏移（平滑插值目标）
        targetEyeX = mouseX * EYE_MAX_OFFSET_X;
        targetEyeY = mouseY * EYE_MAX_OFFSET_Y;

        // 光晕随鼠标偏移
        glow.style.transform = `translateZ(-50px) translateX(${mouseX * 20}px) translateY(${mouseY * 15}px)`;

        // 阴影偏移
        shadow.style.transform = `translateX(calc(-50% + ${mouseX * 30}px)) rotateX(90deg)`;
        shadow.style.opacity = 0.3 + Math.abs(mouseX) * 0.2;

        // 眼睛激活态
        if (eyeSocket) eyeSocket.classList.add('active');
    }

    // 触摸支持
    function onTouchMove(e) {
        if (e.touches.length > 0) {
            onMouseMove(e.touches[0]);
        }
    }

    function onTouchEnd() {
        hasInteraction = false;
        if (eyeSocket) eyeSocket.classList.remove('active');
        targetEyeX = 0; targetEyeY = 0;
        startIdle();
    }

    // 鼠标离开舞台 → 回正
    function onMouseLeave() {
        hasInteraction = false;
        targetRotX = 0;
        targetRotY = 0;
        targetEyeX = 0;
        targetEyeY = 0;
        if (eyeSocket) eyeSocket.classList.remove('active');
        glow.style.transform = 'translateZ(-50px)';
        shadow.style.transform = 'translateX(-50%) rotateX(90deg)';
        shadow.style.opacity = '';
        startIdle();
    }

    // 闲置动画
    function startIdle() {
        idleTimer = setTimeout(() => {
            if (!hasInteraction) {
                container.classList.add('char25-idle');
            }
        }, 2000);
    }

    // 动画循环（平滑插值）
    function animate() {
        // 平滑插值
        curRotX += (targetRotX - curRotX) * 0.08;
        curRotY += (targetRotY - curRotY) * 0.08;
        curEyeX += (targetEyeX - curEyeX) * 0.12;
        curEyeY += (targetEyeY - curEyeY) * 0.12;

        if (!container.classList.contains('char25-idle')) {
            container.style.transform = `rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
        }
        // 眼睛在眼眶内平滑移动
        if (eyeImg) {
            eyeImg.style.transform = `translate(${curEyeX}%, ${curEyeY}%)`;
        }

        requestAnimationFrame(animate);
    }
    animate();

    // 事件绑定
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
        document.addEventListener('mousemove', onMouseMove);
        stage.addEventListener('mouseleave', onMouseLeave);
    } else {
        // 触摸设备
        stage.addEventListener('touchstart', onTouchMove, { passive: true });
        stage.addEventListener('touchmove', onTouchMove, { passive: true });
        stage.addEventListener('touchend', onTouchEnd);
    }

    // 点击角色 → 眨眼效果
    stage.addEventListener('click', function() {
        container.style.transition = 'transform 0.05s ease-out';
        container.style.transform += ' scale(0.97)';
        setTimeout(() => {
            container.style.transition = 'transform 0.15s ease-out';
        }, 80);
        // 眨眼：眼睛垂直缩放
        if (eyeImg) {
            eyeImg.style.transition = 'transform 0.06s ease-out';
            eyeImg.style.transform = `translate(${curEyeX}%, ${curEyeY}%) scaleY(0.1)`;
            setTimeout(() => {
                eyeImg.style.transition = 'transform 0.1s ease-out';
                eyeImg.style.transform = `translate(${curEyeX}%, ${curEyeY}%) scaleY(1)`;
                // 第二次眨眼
                setTimeout(() => {
                    eyeImg.style.transition = 'transform 0.06s ease-out';
                    eyeImg.style.transform = `translate(${curEyeX}%, ${curEyeY}%) scaleY(0.15)`;
                    setTimeout(() => {
                        eyeImg.style.transition = 'transform 0.1s ease-out';
                        eyeImg.style.transform = `translate(${curEyeX}%, ${curEyeY}%) scaleY(1)`;
                    }, 80);
                }, 150);
            }, 100);
        }
    });

    // 页面可见性变化时暂停/恢复
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            container.style.animationPlayState = 'paused';
        } else {
            container.style.animationPlayState = '';
        }
    });

    // 初始闲置
    startIdle();
})();
</script>
