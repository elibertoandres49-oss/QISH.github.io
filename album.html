    <style>
:root {
    --gradient-start: #acbafc;

* {

body {

/* 主题：白 */
html[data-theme="light"] body.album-page {
    --text-main: #0f172a;
    --text-sub: #64748b;
    --glass-bg: rgba(255, 255, 255, 0.88);

}
html[data-theme="light"] body.album-page .trail-light {
    background: radial-gradient(circle, rgba(124, 58, 237, 0.12), transparent 70%);
}

/* 主题：黑 */
html[data-theme="dark"] body.album-page {
    --text-main: #e2e8f0;
    --text-sub: #94a3b8;
    --glass-bg: rgba(30, 41, 59, 0.75);

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.08), transparent 35%);
    transition: background 0.12s ease-out;
    z-index: 0;
}

.trail-light {
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.6s ease, transform 0.08s ease;
    opacity: 0;
    z-index: 1;
}

/* 相册内嵌鼠标光球样式（本页未引入 style.css） */
.mouse-glow {
    position: fixed;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.35) 28%, transparent 55%),
        rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1.5px solid rgba(255, 255, 255, 0.65);
    box-shadow:
        0 4px 16px rgba(15, 23, 42, 0.12),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9990;
    will-change: transform, left, top;
}
.mouse-glow.mouse-glow-adsorb {
    border-color: rgba(255, 255, 255, 0.85);
    background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.5) 30%, transparent 60%),
        rgba(255, 255, 255, 0.4);
    mix-blend-mode: soft-light;
}
.mouse-trail-svg {
    position: fixed;
    left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9988;
}
.mouse-click-ring {
    position: fixed;
    width: 12px; height: 12px;
    margin-left: -6px; margin-top: -6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    pointer-events: none;
    z-index: 9991;
    animation: mouseRingOut 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.mouse-click-splash {
    position: fixed;
    width: 8px; height: 8px;
    margin-left: -4px; margin-top: -4px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
    pointer-events: none;
    z-index: 9991;
    animation: mouseSplashOut 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes mouseRingOut {
    0% { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(4.5); opacity: 0; }
}
@keyframes mouseSplashOut {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(3.2); opacity: 0; }
}

/* 大边框：橡皮绳 + 鼠标内凹 */
.elastic-frame {
    position: relative;
    --dent-x: 50%;
    --dent-y: 50%;
    --dent-s: 0;
    --pull-x: 0px;
    --pull-y: 0px;
    transition:
        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.35s ease,
        border-color 0.3s ease;
    /* no rubber transform */
}
.elastic-frame::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    pointer-events: none;
    z-index: 3;
    /* 边框高光，在鼠标处被“咬”出内凹 */
    background:
        radial-gradient(
            circle 56px at var(--dent-x) var(--dent-y),
            transparent 0%,
            transparent calc(22px + var(--dent-s) * 18px),
            rgba(255, 255, 255, 0.28) calc(28px + var(--dent-s) * 10px),
            transparent calc(42px + var(--dent-s) * 20px)
        );
    opacity: calc(0.08 + var(--dent-s) * 0.28);
    mix-blend-mode: soft-light;
    transition: opacity 0.2s ease;
}
.elastic-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 2;
    /* 内侧阴影随鼠标凹陷 */
    box-shadow:
        inset
            calc((var(--dent-x) - 50%) * 0.18)
            calc((var(--dent-y) - 50%) * 0.18)
            calc(12px + var(--dent-s) * 28px)
            rgba(0, 0, 0, calc(0.03 + var(--dent-s) * 0.06));
    transition: box-shadow 0.15s ease;
}
.elastic-frame.is-near {
    border-color: rgba(255, 255, 255, 0.65);
}
35%  { transform: translate(calc(var(--pull-x) * -0.35), calc(var(--pull-y) * -0.35)) scale(0.97); }
    65%  { transform: translate(calc(var(--pull-x) * 0.12), calc(var(--pull-y) * 0.12)) scale(1.02); }
    100% { transform: translate(0, 0) scale(1); }
}
html[data-theme="dark"] body.album-page .elastic-frame::before {
    background:
        radial-gradient(
            circle 56px at var(--dent-x) var(--dent-y),
            transparent 0%,
            transparent calc(22px + var(--dent-s) * 18px),
            rgba(148, 163, 184, 0.45) calc(28px + var(--dent-s) * 14px),
            transparent calc(42px + var(--dent-s) * 20px)
        );
}
html[data-theme="light"] body.album-page .elastic-frame::before {
    background:
        radial-gradient(
            circle 56px at var(--dent-x) var(--dent-y),
            transparent 0%,
            transparent calc(22px + var(--dent-s) * 18px),
            rgba(59, 130, 246, 0.35) calc(28px + var(--dent-s) * 14px),
            transparent calc(42px + var(--dent-s) * 20px)
        );
}

<script>

function formatDate(str){
    const d = new Date(str);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function deletePhoto(recordId, photoUrl, ownerUserId){
    const {data:{user}} = await sb.auth.getUser();
    if(!user){
        alert("请登录");
        return;
    }
    const isAdmin = ADMIN_UIDS.includes(user.id);
    if(!isAdmin && user.id !== ownerUserId){
        alert("没有权限删除");
        return;
    }

    if(!confirm("确定删除这张照片？删除后无法恢复！")) return;

    let filePath = null;
    console.log("===删除调试===");
    console.log("photoUrl:", photoUrl);
    console.log("当前登录user.id:", user.id);
    console.log("图片ownerUserId:", ownerUserId);
    console.log("isAdmin:",isAdmin);

    if(photoUrl){
        const reg = /\/storage\/v1\/object\/public\/album_bucket\/(.*)$/;
        const match = photoUrl.match(reg);
        if(match && match[1]){
            filePath = decodeURIComponent(match[1]);
        }
    }

    if(!filePath){
        alert("无法解析图片路径，终止删除");
        console.error("filePath解析失败！photoUrl=",photoUrl);
        return;
    }
    console.log("解析得到filePath:", filePath);

    try{
        const {error:storageErr} = await sb.storage.from(BUCKET_NAME).remove([filePath]);
        console.log("storage删除 error:", storageErr);

        const {error:dbErr} = await sb.from("public_album").delete().eq("id", recordId);
        console.log("数据库删除 error:", dbErr);

        if(dbErr){
            alert("删除数据库记录失败："+dbErr.message);
            return;
        }
        msgBox.innerText="✅照片已删除";
        loadAlbum();
    }catch(e){
        console.error("删除捕获异常",e);
        msgBox.innerText="删除异常";
    }
}

async function loadAlbum(){
    msgBox.innerText="";
    const {data:{user}} = await sb.auth.getUser();
    const isAdmin = user ? ADMIN_UIDS.includes(user.id) : false;

    const {data,error}=await sb
        .from("public_album")
        .select("*")
        .order("upload_at",{ascending:false});

    if(error){
        msgBox.innerText="读取相册失败："+error.message;
        return;
    }
    albumContainer.innerHTML="";
    if(!data || data.length===0){
        albumContainer.innerHTML = `<div style="padding:40px;text-align:center;color:#666;">相册暂无图片，登录后可以上传照片</div>`;
        return;
    }

    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    data.forEach(item=>{
        const div = document.createElement("div");
        div.className="photo-card elastic-frame";
        const safeUrl = item.photo_url || "";
        const safeNick = escapeHtml(item.nickname || "匿名用户");
        const safeId = escapeHtml(item.id);
        const safeOwner = escapeHtml(item.user_id);
        let delHtml = "";
        if(user && (user.id === item.user_id || isAdmin)){
            delHtml = `<button type="button" class="del-btn" data-rid="${safeId}" data-owner="${safeOwner}">删除照片</button>`;
        }
        div.innerHTML=`
            <div class="img-wrap">
                <img src="${escapeHtml(safeUrl)}" alt="" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-name">${safeNick}</div>
                <div>${formatDate(item.upload_at)}</div>
                ${delHtml}
            </div>
        `;
        div.querySelector(".img-wrap").onclick = ()=>{
            modalImage.src = safeUrl;
            photoModal.classList.add("active");
        };
        const delBtn = div.querySelector(".del-btn");
        if(delBtn){
            delBtn.onclick = async (ev)=>{
                ev.stopPropagation();
                const rid = delBtn.dataset.rid;
                const oid = delBtn.dataset.owner;
                await deletePhoto(rid, safeUrl, oid);
            };
        }
        albumContainer.appendChild(div);
    });
    if (window.__albumBindElastic) window.__albumBindElastic();
}

uploadBtn.onclick = async ()=>{
    msgBox.innerText="";
    const {data:{user}} = await sb.auth.getUser();
    if(!user){
        msgBox.innerText="请先登录账号";
        return;
    }
    const file = photoInput.files[0];
    if(!file){
        msgBox.innerText="请选择一张图片";
        return;
    }

    let nickName = "匿名用户";
    const {data:userInfo} = await sb.from("public_user_list").select("nickname").eq("user_id",user.id).single();
    if(userInfo?.nickname) nickName = userInfo.nickname;

    const filePath = `${user.id}/${Date.now()}.${file.name.split(".").pop()}`;
    const {error:upErr} = await sb.storage.from(BUCKET_NAME).upload(filePath, file, {cacheControl:"3600",upsert:false});
    if(upErr){
        msgBox.innerText="上传失败："+upErr.message;
        return;
    }
    const {data:urlObj} = sb.storage.from(BUCKET_NAME).getPublicUrl(filePath);
    const photoUrl = urlObj.publicUrl;

    const {error:insertErr} = await sb.from("public_album").insert({
        user_id:user.id,
        photo_url:photoUrl,
        nickname:nickName,
        upload_at:new Date().toISOString()
    });
    if(insertErr){
        msgBox.innerText="保存相册记录失败："+insertErr.message;
        return;
    }
    msgBox.innerText="✅上传成功";
    photoInput.value = "";
    fileNameTip.innerText = "";
    loadAlbum();
};
// —— 相册页鼠标光晕 + 大边框内凹 / 橡皮绳 ——
(function albumMouseFX() {
    const trailLight = document.getElementById("trailLight");
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let trailX = mouseX;
    let trailY = mouseY;
    let prevX = mouseX;
    let prevY = mouseY;
    let vx = 0;
    let vy = 0;

    window.addEventListener("mousemove", (e) => {
        vx = e.clientX - prevX;
        vy = e.clientY - prevY;
        prevX = e.clientX;
        prevY = e.clientY;
        mouseX = e.clientX;
        mouseY = e.clientY;
        document.body.style.setProperty("--mouse-x", mouseX + "px");
        document.body.style.setProperty("--mouse-y", mouseY + "px");
        if (trailLight) {
            trailLight.style.left = mouseX + "px";
            trailLight.style.top = mouseY + "px";
            trailLight.style.opacity = "1";
        }
    }, { passive: true });

    window.addEventListener("mouseout", () => {
        if (trailLight) trailLight.style.opacity = "0";
    });

    function animateTrail() {
        trailX += (mouseX - trailX) * 0.1;
        trailY += (mouseY - trailY) * 0.1;
        if (trailLight) {
            trailLight.style.transform =
                "translate(-50%, -50%) translate(" +
                ((trailX - mouseX) * 0.04).toFixed(2) + "px, " +
                ((trailY - mouseY) * 0.04).toFixed(2) + "px)";
        }
        requestAnimationFrame(animateTrail);
    }
    animateTrail();

    const EDGE = 48;
    let frames = [];

    function refreshFrames() {
        frames = Array.prototype.slice.call(document.querySelectorAll(".elastic-frame"));
    }

    function bindElastic() {
        refreshFrames();
        frames.forEach(function (el) {
            if (el.__elasticBound) return;
            el.__elasticBound = true;
            // 已取消橡皮绳弹簧；仅保留轻微边框内凹
            el.addEventListener("mouseleave", function () {
                el.style.setProperty("--dent-s", "0");
                el.classList.remove("is-near");
            });
        });
    }

    function updateDents() {
        if (!frames.length) refreshFrames();
        for (var i = 0; i < frames.length; i++) {
            var el = frames[i];
            var r = el.getBoundingClientRect();
            if (r.width < 8) continue;
            var inside =
                mouseX >= r.left && mouseX <= r.right &&
                mouseY >= r.top && mouseY <= r.bottom;
            var lx = mouseX - r.left;
            var ly = mouseY - r.top;

            if (inside) {
                var minEdge = Math.min(lx, r.width - lx, ly, r.height - ly);
                var near = minEdge < EDGE;
                var strength = near ? (1 - minEdge / EDGE) : 0.18;
                el.style.setProperty("--dent-x", ((lx / r.width) * 100).toFixed(2) + "%");
                el.style.setProperty("--dent-y", ((ly / r.height) * 100).toFixed(2) + "%");
                el.style.setProperty("--dent-s", strength.toFixed(3));
                el.classList.toggle("is-near", near);
            } else {
                var cx = Math.max(r.left, Math.min(mouseX, r.right));
                var cy = Math.max(r.top, Math.min(mouseY, r.bottom));
                var d = Math.hypot(mouseX - cx, mouseY - cy);
                if (d < EDGE * 1.2) {
                    var s = 1 - d / (EDGE * 1.2);
                    el.style.setProperty("--dent-x", (((cx - r.left) / r.width) * 100).toFixed(2) + "%");
                    el.style.setProperty("--dent-y", (((cy - r.top) / r.height) * 100).toFixed(2) + "%");
                    el.style.setProperty("--dent-s", (s * 0.9).toFixed(3));
                    el.classList.add("is-near");
                } else {
                    el.style.setProperty("--dent-s", "0");
                    el.classList.remove("is-near");
                }
            }
        }
        requestAnimationFrame(updateDents);
    }

    window.__albumBindElastic = bindElastic;
    bindElastic();
    requestAnimationFrame(updateDents);

    function ensureGlow() {
        if (window.QISH && typeof window.QISH.initMouseGlow === "function") {
            try { window.QISH.initMouseGlow(); } catch (_) {}
        }
    }
    setTimeout(ensureGlow, 80);
})();
window.onload = loadAlbum;
</script>
