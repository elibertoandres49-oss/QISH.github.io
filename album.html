    <style>
    body.album-page { overflow-x: hidden; }
    .album-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px 0;
        max-width: 1400px;
        margin: 0 auto;
    }
    .album-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--text-main);
    }
    .album-actions { display: flex; gap: 10px; align-items: center; }
    .album-tip {
        text-align: center;
        color: var(--text-sub);
        font-size: 13px;
        padding: 8px;
    }
    .scatter-wall {
        position: relative;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 75vh;
    }
    .polaroid {
        position: absolute;
        width: 170px;
        background: #fff;
        padding: 8px 8px 32px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        z-index: 1;
        border-radius: 2px;
    }
    .polaroid:hover {
        transform: scale(1.18) rotate(0deg) !important;
        z-index: 100 !important;
        box-shadow: 0 16px 48px rgba(0,0,0,0.25);
    }
    .polaroid img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        display: block;
        border-radius: 1px;
    }
    .polaroid-caption {
        position: absolute;
        bottom: 6px;
        left: 0; right: 0;
        text-align: center;
        font-size: 11px;
        color: #666;
        font-family: "Comic Sans MS", "Caveat", cursive;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 6px;
    }
    .polaroid-del {
        position: absolute;
        top: -8px; right: -8px;
        width: 22px; height: 22px;
        border-radius: 50%;
        background: #ef4444;
        color: #fff;
        border: none;
        font-size: 11px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s;
        display: flex; align-items: center; justify-content: center;
        z-index: 2;
    }
    .polaroid:hover .polaroid-del { opacity: 1; }
    .scatter-upload {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 60;
    }
    .scatter-upload-btn {
        width: 58px; height: 58px;
        border-radius: 50%;
        border: none;
        background: var(--accent-grad);
        color: #fff;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(91,168,160,0.45);
        transition: transform 0.3s ease;
        display: flex; align-items: center; justify-content: center;
    }
    .scatter-upload-btn:hover { transform: scale(1.1) rotate(90deg); }
    .upload-panel {
        position: fixed;
        bottom: 100px;
        right: 28px;
        z-index: 61;
        background: var(--card-bg-strong);
        backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--card-shadow-hover);
        display: none;
        width: 280px;
    }
    .upload-panel.show { display: block; }
    .upload-panel h4 { margin: 0 0 10px; font-size: 14px; }
    .upload-panel .file-btn {
        display: block; width: 100%;
        padding: 10px; border-radius: 12px;
        border: 1px dashed var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px; font-weight: 600;
        cursor: pointer; text-align: center;
        margin-bottom: 8px;
    }
    .upload-panel .up-btn {
        display: block; width: 100%;
        padding: 10px; border-radius: 12px;
        border: none;
        background: var(--accent-grad);
        color: #fff;
        font-size: 13px; font-weight: 600;
        cursor: pointer;
    }
    .upload-panel .up-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-panel .file-name {
        font-size: 12px; color: var(--text-sub);
        margin-bottom: 8px; word-break: break-all;
    }
    .upload-panel .msg { font-size: 12px; margin-top: 8px; }
    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center; justify-content: center;
        z-index: 999; padding: 24px;
    }
    .modal-overlay.active { display: flex; }
    .modal-img-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 90vw;
        max-height: 80vh;
    }
    .modal-img {
        max-width: 90vw;
        max-height: 78vh;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        transition: opacity 0.25s ease, transform 0.3s ease;
        user-select: none;
        -webkit-user-drag: none;
    }
    .modal-img.switching { opacity: 0; transform: scale(0.96); }
    .modal-img.switch-left { transform: translateX(-30px); opacity: 0; }
    .modal-img.switch-right { transform: translateX(30px); opacity: 0; }
    .modal-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 10;
        line-height: 1;
    }
    .modal-nav:hover { background: rgba(255,255,255,0.3); transform: translateY(-50%) scale(1.1); }
    .modal-prev { left: 24px; }
    .modal-next { right: 24px; }
    .modal-counter {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        background: rgba(0,0,0,0.4);
        padding: 6px 16px;
        border-radius: 20px;
        backdrop-filter: blur(8px);
    }
    .modal-caption {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 13px;
        background: rgba(0,0,0,0.4);
        padding: 4px 14px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        white-space: nowrap;
        max-width: 80vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .close-modal {
        position: absolute; top: 20px; right: 24px;
        color: #fff; font-size: 36px; cursor: pointer;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .empty-album {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--text-sub);
        font-size: 16px;
    }
    </style>

<script>
const SUPABASE_URL = "https://gmrzngjwwqftkwatrqcd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcnpuZ2p3d3FmdGt3YXRycWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM1NjMsImV4cCI6MjEwMjc0OTU2M30.iy-RrMQ-hg6-r0Y0RKkmxq3pBPbPmjkq2piifrcRh1M";
const ADMIN_UIDS = ["8dbea2a6-e81e-4958-8c7a-3cbb47b2eb7d"];
const BUCKET_NAME = "album_bucket";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: "qish-auth-v1" }
});
window.supabaseClient = sb;

const scatterWall = document.getElementById("scatterWall");
const photoInput = document.getElementById("photoInput");
const uploadBtn = document.getElementById("uploadBtn");
const fileNameTip = document.getElementById("fileNameTip");
const msgBox = document.getElementById("msgBox");
const photoModal = document.getElementById("photoModal");
const modalImage = document.getElementById("modalImage");
const closeModal = document.getElementById("closeModal");
const modalPrev = document.getElementById("modalPrev");
const modalNext = document.getElementById("modalNext");
const modalCounter = document.getElementById("modalCounter");
const modalCaption = document.getElementById("modalCaption");
const uploadFab = document.getElementById("uploadFab");
const uploadPanel = document.getElementById("uploadPanel");

// 缓存相册数据，resize 时不重新拉取
let cachedAlbumData = null;
let currentPhotoIndex = 0;
let isSwitching = false;

// 打开大图预览
function openPhotoModal(index) {
    if (!cachedAlbumData || cachedAlbumData.length === 0) return;
    currentPhotoIndex = index;
    showPhoto(index, null);
    photoModal.classList.add("active");
}

// 显示指定索引的照片（带滑动动画）
function showPhoto(index, direction) {
    if (!cachedAlbumData || cachedAlbumData.length === 0) return;
    if (index < 0) index = cachedAlbumData.length - 1;
    if (index >= cachedAlbumData.length) index = 0;
    currentPhotoIndex = index;

    const item = cachedAlbumData[index];
    const safeUrl = item.photo_url || "";
    const safeNick = escapeHtml(item.nickname || "匿名");
    const dateStr = formatDate(item.upload_at);

    if (direction) {
        isSwitching = true;
        modalImage.classList.add(direction === "next" ? "switch-right" : "switch-left");
        setTimeout(() => {
            modalImage.src = safeUrl;
            modalCaption.textContent = safeNick + " · " + dateStr;
            modalCounter.textContent = (index + 1) + " / " + cachedAlbumData.length;
            modalImage.classList.remove("switch-right", "switch-left");
            isSwitching = false;
        }, 200);
    } else {
        modalImage.src = safeUrl;
        modalCaption.textContent = safeNick + " · " + dateStr;
        modalCounter.textContent = (index + 1) + " / " + cachedAlbumData.length;
    }
}

function prevPhoto() {
    if (isSwitching) return;
    showPhoto(currentPhotoIndex - 1, "prev");
}
function nextPhoto() {
    if (isSwitching) return;
    showPhoto(currentPhotoIndex + 1, "next");
}

// 关闭
closeModal.onclick = () => photoModal.classList.remove("active");
photoModal.onclick = (e) => { if (e.target === photoModal) photoModal.classList.remove("active"); };

// 左右箭头
modalPrev.onclick = (e) => { e.stopPropagation(); prevPhoto(); };
modalNext.onclick = (e) => { e.stopPropagation(); nextPhoto(); };

// 键盘控制
document.addEventListener("keydown", (e) => {
    if (!photoModal.classList.contains("active")) return;
    if (e.key === "ArrowLeft") prevPhoto();
    else if (e.key === "ArrowRight") nextPhoto();
    else if (e.key === "Escape") photoModal.classList.remove("active");
});

// 触摸滑动
let touchStartX = 0;
let touchStartY = 0;
photoModal.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });
photoModal.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) prevPhoto();
        else nextPhoto();
    }
}, { passive: true });

// 上传面板切换
uploadFab.addEventListener('click', () => uploadPanel.classList.toggle('show'));
document.addEventListener('click', (e) => {
    if (!uploadPanel.contains(e.target) && e.target !== uploadFab && !uploadFab.contains(e.target)) {
        uploadPanel.classList.remove('show');
    }
});

photoInput.onchange = () => {
    if (photoInput.files[0]) {
        fileNameTip.textContent = photoInput.files[0].name;
        uploadBtn.disabled = false;
    } else {
        fileNameTip.textContent = "";
        uploadBtn.disabled = true;
    }
};

function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function formatDate(str) {
    const d = new Date(str);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

// 生成随机散落位置
function scatterPositions(count) {
    const positions = [];
    const wallWidth = scatterWall.offsetWidth || 1200;
    const wallHeight = Math.max(600, count * 80);
    const itemW = 170, itemH = 200;
    const cols = Math.max(3, Math.floor(wallWidth / (itemW + 30)));
    const rows = Math.ceil(count / cols);
    for (let i = 0; i < count; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const baseX = col * (wallWidth / cols) + (wallWidth / cols - itemW) / 2;
        const baseY = row * (itemH + 40) + 20;
        const jitterX = (Math.random() - 0.5) * 60;
        const jitterY = (Math.random() - 0.5) * 30;
        const rotate = (Math.random() - 0.5) * 20;
        positions.push({
            left: baseX + jitterX,
            top: baseY + jitterY,
            rotate: rotate,
            z: Math.floor(Math.random() * 10) + 1
        });
    }
    return { positions, height: rows * (itemH + 40) + 60 };
}

// 渲染照片（使用缓存数据或新数据）
function renderAlbum(data) {
    if (!data || data.length === 0) {
        scatterWall.innerHTML = '<div class="empty-album">相册暂无图片<br><small>登录后点击右下角 + 上传</small></div>';
        return;
    }
    const { positions, height } = scatterPositions(data.length);
    scatterWall.style.height = height + "px";
    scatterWall.innerHTML = "";

    data.forEach((item, idx) => {
        const pos = positions[idx];
        const div = document.createElement("div");
        div.className = "polaroid";
        div.style.left = pos.left + "px";
        div.style.top = pos.top + "px";
        div.style.transform = `rotate(${pos.rotate}deg)`;
        div.style.zIndex = pos.z;
        const safeUrl = item.photo_url || "";
        const safeNick = escapeHtml(item.nickname || "匿名");
        const dateStr = formatDate(item.upload_at);
        let delHtml = "";
        const user = window.__qishCurrentUser;
        const isAdmin = user ? ADMIN_UIDS.includes(user.id) : false;
        if (user && (user.id === item.user_id || isAdmin)) {
            delHtml = `<button class="polaroid-del" data-rid="${escapeHtml(item.id)}" data-owner="${escapeHtml(item.user_id)}" data-url="${escapeHtml(safeUrl)}">×</button>`;
        }
        div.innerHTML = `
            ${delHtml}
            <img src="${escapeHtml(safeUrl)}" alt="" loading="lazy">
            <div class="polaroid-caption">${safeNick} · ${dateStr}</div>
        `;
        div.querySelector("img").onclick = () => {
            openPhotoModal(idx);
        };
        const delBtn = div.querySelector(".polaroid-del");
        if (delBtn) {
            delBtn.onclick = (ev) => {
                ev.stopPropagation();
                deletePhoto(delBtn.dataset.rid, delBtn.dataset.url, delBtn.dataset.owner);
            };
        }
        scatterWall.appendChild(div);
    });
}

async function deletePhoto(recordId, photoUrl, ownerUserId) {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { alert("请登录"); return; }
    const isAdmin = ADMIN_UIDS.includes(user.id);
    if (!isAdmin && user.id !== ownerUserId) { alert("没有权限删除"); return; }
    if (!confirm("确定删除这张照片？")) return;

    let filePath = null;
    if (photoUrl) {
        const match = photoUrl.match(/\/storage\/v1\/object\/public\/album_bucket\/(.*)$/);
        if (match && match[1]) filePath = decodeURIComponent(match[1]);
    }
    if (!filePath) { alert("无法解析图片路径"); return; }

    try {
        await sb.storage.from(BUCKET_NAME).remove([filePath]);
        const { error } = await sb.from("public_album").delete().eq("id", recordId);
        if (error) { alert("删除失败：" + error.message); return; }
        msgBox.textContent = "已删除";
        loadAlbum(true);
    } catch (e) {
        alert("删除异常：" + e.message);
    }
}

async function loadAlbum(forceRefresh) {
    msgBox.textContent = "";
    const { data: { user } } = await sb.auth.getUser();
    window.__qishCurrentUser = user || null;

    // 使用缓存（除非强制刷新）
    if (cachedAlbumData && !forceRefresh) {
        renderAlbum(cachedAlbumData);
        return;
    }

    const { data, error } = await sb.from("public_album").select("*").order("upload_at", { ascending: false });
    if (error) {
        scatterWall.innerHTML = '<div class="empty-album">读取相册失败</div>';
        return;
    }
    cachedAlbumData = data || [];
    renderAlbum(cachedAlbumData);
}

uploadBtn.onclick = async () => {
    msgBox.textContent = "";
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { msgBox.textContent = "请先登录"; return; }
    const file = photoInput.files[0];
    if (!file) { msgBox.textContent = "请选择图片"; return; }

    uploadBtn.disabled = true;
    uploadBtn.textContent = "上传中...";
    msgBox.textContent = "上传中...";

    let nickName = "匿名用户";
    try {
        const { data: userInfo } = await sb.from("public_user_list").select("nickname").eq("user_id", user.id).single();
        if (userInfo?.nickname) nickName = userInfo.nickname;
    } catch (_) {}

    const filePath = `${user.id}/${Date.now()}.${file.name.split(".").pop()}`;
    try {
        const { error: upErr } = await sb.storage.from(BUCKET_NAME).upload(filePath, file, { cacheControl: "3600", upsert: false });
        if (upErr) throw upErr;
        const { data: urlData } = sb.storage.from(BUCKET_NAME).getPublicUrl(filePath);
        const { error: insErr } = await sb.from("public_album").insert({
            user_id: user.id,
            nickname: nickName,
            photo_url: urlData.publicUrl,
            upload_at: new Date().toISOString()
        });
        if (insErr) throw insErr;
        msgBox.textContent = "上传成功";
        photoInput.value = "";
        fileNameTip.textContent = "";
        uploadBtn.disabled = true;
        uploadBtn.textContent = "上传";
        uploadPanel.classList.remove("show");
        loadAlbum(true);
    } catch (e) {
        msgBox.textContent = "上传失败：" + e.message;
        uploadBtn.disabled = false;
        uploadBtn.textContent = "上传";
    }
};

// DOM 就绪即加载，不等所有图片
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => loadAlbum());
} else {
    loadAlbum();
}

// resize 防抖：只重新计算位置，不重新拉取数据
let resizeTimer = null;
window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (cachedAlbumData) renderAlbum(cachedAlbumData);
    }, 250);
});
</script>
</body>
</html>
