<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册 - QISH</title>
    <link rel="icon" href="avatar.jpg">
    <link rel="stylesheet" href="style.css">
    <script>
    (function(){try{var t=localStorage.getItem("qish_theme");document.documentElement.setAttribute("data-theme",(t==="light"||t==="dark"||t==="aqua"||t==="custom")?t:"aqua");}catch(e){document.documentElement.setAttribute("data-theme","aqua");}})();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
    <script>
    (function initSupabase() {
        window.SUPABASE_URL = "https://gmrzngjwwqftkwatrqcd.supabase.co";
        window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcnpuZ2p3d3FmdGt3YXRycWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM1NjMsImV4cCI6MjEwMjc0OTU2M30.iy-RrMQ-hg6-r0Y0RKkmxq3pBPbPmjkq2piifrcRh1M";
        function tryCreate() {
            if (window.supabase && typeof window.supabase.createClient === "function") {
                window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: "qish-auth-v1" }
                });
            } else { setTimeout(tryCreate, 80); }
        }
        tryCreate();
    })();
    </script>
    <script src="common.js" defer></script>
    <style>
    .auth-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .auth-card {
        background: var(--card-bg-strong);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }
    .auth-logo {
        text-align: center;
        margin-bottom: 24px;
    }
    .auth-logo img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--card-border);
        box-shadow: var(--card-shadow);
        margin-bottom: 12px;
    }
    .auth-logo h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0;
    }
    .auth-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        background: var(--card-bg);
        padding: 5px;
        border-radius: 14px;
    }
    .auth-tab {
        flex: 1;
        padding: 10px;
        border: none;
        background: transparent;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: var(--text-sub);
        transition: all 0.2s ease;
    }
    .auth-tab.active {
        background: var(--accent-grad);
        color: #fff;
        box-shadow: 0 4px 12px rgba(91,168,160,0.3);
    }
    .auth-form .form-group { margin-bottom: 16px; }
    .auth-submit {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: none;
        background: var(--accent-grad);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 16px rgba(91,168,160,0.3);
        margin-top: 8px;
    }
    .auth-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,168,160,0.4); }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-msg {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        display: none;
    }
    .auth-msg.error { display: block; background: rgba(239,68,68,0.1); color: #dc2626; }
    .auth-msg.success { display: block; background: rgba(34,197,94,0.1); color: #16a34a; }
    .auth-msg.info { display: block; background: var(--accent-soft); color: var(--accent); }
    .auth-back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--text-sub);
        text-decoration: none;
        font-size: 13px;
        transition: color 0.2s;
    }
    .auth-back:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="qishi-expr-normal.gif" alt="QISH">
                <h1>QISH 小站</h1>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>
            <form class="auth-form" id="authForm" onsubmit="return false;">
                <div class="form-group" id="nicknameGroup" style="display:none;">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-input" id="nickname" placeholder="给自己起个名字" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="至少6位" required minlength="6">
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">登录</button>
                <div class="auth-msg" id="authMsg"></div>
            </form>
            <a href="index.html" class="auth-back">← 返回首页</a>
        </div>
    </div>


    <div class="mouse-glow" id="glow"></div>

<script>
const SUPABASE_URL = "https://gmrzngjwwqftkwatrqcd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcnpuZ2p3d3FmdGt3YXRycWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM1NjMsImV4cCI6MjEwMjc0OTU2M30.iy-RrMQ-hg6-r0Y0RKkmxq3pBPbPmjkq2piifrcRh1M";
let sb = null;
(function initSb() {
    if (window.supabase && typeof window.supabase.createClient === "function") {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: "qish-auth-v1" }
        });
        window.supabaseClient = sb;
    } else {
        setTimeout(initSb, 80);
    }
})();

let mode = "login";
const tabs = document.querySelectorAll(".auth-tab");
const nicknameGroup = document.getElementById("nicknameGroup");
const submitBtn = document.getElementById("submitBtn");
const authMsg = document.getElementById("authMsg");

tabs.forEach(tab => {
    tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.tab;
        nicknameGroup.style.display = mode === "register" ? "block" : "none";
        submitBtn.textContent = mode === "register" ? "注册" : "登录";
        authMsg.className = "auth-msg";
        authMsg.textContent = "";
    });
});

function showMsg(type, text) {
    authMsg.className = "auth-msg " + type;
    authMsg.textContent = text;
}

document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const nickname = document.getElementById("nickname").value.trim();

    if (!email || !password) { showMsg("error", "请填写邮箱和密码"); return; }
    if (mode === "register" && !nickname) { showMsg("error", "请填写昵称"); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === "register" ? "注册中..." : "登录中...";

    try {
        if (mode === "login") {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            showMsg("success", "登录成功！正在跳转...");
            setTimeout(() => location.href = "index.html", 800);
        } else {
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) throw error;
            if (data.user && !data.session) {
                showMsg("info", "注册成功！请查收邮箱验证链接后登录。");
            } else {
                // 先查询是否存在记录
                const { data: existUser } = await sb.from("public_user_list").select("user_id").eq("user_id", data.user.id).maybeSingle();
                if (existUser) {
                    await sb.from("public_user_list").update({ nickname, email }).eq("user_id", data.user.id);
                } else {
                    await sb.from("public_user_list").insert({ user_id: data.user.id, nickname, email });
                }
                showMsg("success", "注册成功！正在跳转...");
                setTimeout(() => location.href = "index.html", 800);
            }
        }
    } catch (err) {
        showMsg("error", err.message || "操作失败，请重试");
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "register" ? "注册" : "登录";
    }
});

// 已登录则跳转
(async () => {
    const { data: { user } } = await sb.auth.getUser();
    if (user) location.href = "index.html";
})();
</script>
</body>
</html>
