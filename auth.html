<div class="container" style="background:transparent; backdrop-filter:none; border:none; box-shadow:none;">
    <div class="auth-card">
        <h1 id="form-title">登录</h1>
        <div id="message"></div>
        <form id="auth-form">
            <label class="auth-label">邮箱</label>
            <input class="auth-input" type="email" id="email" required placeholder="请输入邮箱">

            <label class="auth-label">密码（至少6位）</label>
            <input class="auth-input" type="password" id="password" minlength="6" required placeholder="请输入密码">

            <button class="auth-submit" type="submit" id="submit-btn">登录</button>
        </form>
        <div class="auth-toggle-wrap">
            <span id="toggle-text">没有账号？</span>
            <button class="auth-toggle" id="toggle-mode" type="button">去注册</button>
        </div>
        <a class="back-home" href="index.html">← 返回首页</a>
    </div>
</div>
<footer>© 2026 QISH · </footer>

<script>
let isLoginMode = true;
const formTitle = document.getElementById('form-title');
const submitBtn = document.getElementById('submit-btn');
const toggleText = document.getElementById('toggle-text');
const toggleBtn = document.getElementById('toggle-mode');
const authForm = document.getElementById('auth-form');
const msgBox = document.getElementById('message');

toggleBtn.addEventListener('click', ()=>{
    isLoginMode = !isLoginMode;
    if(isLoginMode){
        formTitle.innerText = "登录";
        submitBtn.innerText = "登录";
        toggleText.innerText = "没有账号？";
        toggleBtn.innerText = "去注册";
    }else{
        formTitle.innerText = "注册账号";
        submitBtn.innerText = "注册";
        toggleText.innerText = "已有账号？";
        toggleBtn.innerText = "去登录";
    }
    msgBox.innerText = '';
});

authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    msgBox.innerText = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    let res;
    if(isLoginMode){
        res = await supabase.auth.signInWithPassword({email,password});
    }else{
        res = await supabase.auth.signUp({
            email,
            password,
            options:{
                emailRedirectTo: window.location.origin + "/auth.html"
            }
        });
    }

    if(res.error){
        msgBox.style.color="red";
        msgBox.innerText = res.error.message;
    }else{
        msgBox.style.color='green';
        if(isLoginMode){
            msgBox.innerText = "登录成功！跳转首页";
            setTimeout(()=>{ window.location.href="index.html"; },800);
        }else{
            msgBox.innerText = "注册成功，请去邮箱确认邮件（查看垃圾箱）";
        }
    }
});

document.addEventListener("DOMContentLoaded", async () => {
    if (window.QISH) {
        await QISH.updateAuthNav({ supabase });
    }
    const {data} = await supabase.auth.getSession();
    if(data.session){
        window.location.href="index.html";
    }
});
</script>
