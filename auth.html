<script>
let isLoginMode = true;
const formTitle = document.getElementById('form-title');
const submitBtn = document.getElementById('submit-btn');
const toggleText = document.getElementById('toggle-text');
const toggleBtn = document.getElementById('toggle-mode');
const authForm = document.getElementById('auth-form');
const msgBox = document.getElementById('message');

// 等待 Supabase 客户端就绪（最多 10 秒）
async function waitForSupabase() {
    if (window.supabaseClient) return window.supabaseClient;
    return new Promise((resolve) => {
        let elapsed = 0;
        const iv = setInterval(() => {
            elapsed += 200;
            if (window.supabaseClient) {
                clearInterval(iv);
                resolve(window.supabaseClient);
            } else if (elapsed >= 10000) {
                clearInterval(iv);
                resolve(null);
            }
        }, 200);
    });
}

function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.style.opacity = loading ? '0.6' : '1';
    submitBtn.style.cursor = loading ? 'not-allowed' : 'pointer';
    if (loading) {
        submitBtn.dataset.origText = submitBtn.innerText;
        submitBtn.innerText = isLoginMode ? '登录中…' : '注册中…';
    } else if (submitBtn.dataset.origText) {
        submitBtn.innerText = submitBtn.dataset.origText;
    }
}

function friendlyError(msg) {
    if (!msg) return '操作失败，请重试';
    if (msg.includes('Invalid login credentials')) return '邮箱或密码错误';
    if (msg.includes('Email not confirmed')) return '该邮箱尚未验证，请先去邮箱点击确认链接';
    if (msg.includes('User already registered')) return '该邮箱已注册，请直接登录';
    if (msg.includes('Password should be at least')) return '密码至少需要 6 位';
    if (msg.includes('Unable to validate email address')) return '邮箱格式不正确';
    if (msg.includes('Failed to fetch') || msg.includes('Network')) return '网络连接失败，请检查网络后重试';
    return msg;
}

toggleBtn.addEventListener('click', ()=>{
    isLoginMode = !isLoginMode;
    if(isLoginMode){
        formTitle.innerText = "登录";
        submitBtn.innerText = "登录";
        toggleText.innerText = "没有账号？";
        toggleBtn.innerText = "去注册";
    }else{
        formTitle.innerText = "注册账号";
        submitBtn.innerText = "注册";
        toggleText.innerText = "已有账号？";
        toggleBtn.innerText = "去登录";
    }
    msgBox.innerText = '';
});

/** 把 session 写入主 key + 备份 key，并同步到 SDK 内存（防止跳转后 getSession 为空） */
async function persistSessionHard(sb, session) {
    if (!session || !session.access_token) return false;
    try {
        localStorage.setItem("qish-auth-v1", JSON.stringify(session));
        localStorage.setItem("qish-auth-backup-v1", JSON.stringify({
            access_token: session.access_token,
            refresh_token: session.refresh_token || "",
            expires_at: session.expires_at || null,
            expires_in: session.expires_in || null,
            token_type: session.token_type || "bearer",
            user: session.user || null
        }));
    } catch (e) {
        console.warn("[QISH] 写入 localStorage 失败", e);
    }
    try {
        if (session.refresh_token) {
            var setRes = await sb.auth.setSession({
                access_token: session.access_token,
                refresh_token: session.refresh_token
            });
            if (setRes && setRes.data && setRes.data.session) {
                try {
                    localStorage.setItem("qish-auth-v1", JSON.stringify(setRes.data.session));
                } catch (_) {}
                return true;
            }
        }
    } catch (e) {
        console.warn("[QISH] setSession 失败，已保留本地 session", e);
    }
    try {
        var check = await sb.auth.getSession();
        if (check && check.data && check.data.session) return true;
    } catch (_) {}
    return !!(session && session.user);
}

authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    msgBox.innerText = '';
    const sb = await waitForSupabase();
    if (!sb) {
        msgBox.style.color = "red";
        msgBox.innerText = "认证服务加载失败，请刷新页面或检查网络连接";
        return;
    }
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    setLoading(true);

    try {
        let res;
        if(isLoginMode){
            res = await sb.auth.signInWithPassword({email,password});
        }else{
            res = await sb.auth.signUp({
                email,
                password,
                options:{
                    emailRedirectTo: window.location.origin + "/auth.html"
                }
            });
        }

        if(res.error){
            msgBox.style.color="red";
            msgBox.innerText = friendlyError(res.error.message);
            setLoading(false);
            return;
        }
        msgBox.style.color = "green";
        if (isLoginMode) {
            if (!(res.data && res.data.session)) {
                msgBox.style.color = "red";
                msgBox.innerText = "登录成功但会话未建立。若开启了邮箱确认，请先点邮件里的确认链接后再登录。";
                setLoading(false);
                return;
            }
            var ok = await persistSessionHard(sb, res.data.session);
            if (!ok) {
                msgBox.style.color = "red";
                msgBox.innerText = "会话写入失败，请关闭无痕模式后重试，或检查浏览器是否禁用了本地存储";
                setLoading(false);
                return;
            }
            msgBox.innerHTML = '登录成功！正在跳转…<br><a href="index.html" style="color:inherit;font-weight:700;">若未跳转请点这里</a>';
            setTimeout(function () {
                window.location.replace("index.html");
            }, 600);
            return;
        } else {
            if (res.data && res.data.session) {
                await persistSessionHard(sb, res.data.session);
                msgBox.innerHTML = '注册成功，已自动登录…<br><a href="index.html" style="color:inherit;font-weight:700;">点此进入首页</a>';
                setTimeout(function () {
                    window.location.replace("index.html");
                }, 600);
                return;
            }
            msgBox.innerText = "注册成功，请去邮箱点击确认邮件（查看垃圾箱），确认后即可登录";
            setLoading(false);
        }
    } catch (err) {
        console.error(err);
        msgBox.style.color = "red";
        msgBox.innerText = friendlyError(err && err.message ? err.message : String(err));
        setLoading(false);
    }
});

document.addEventListener("DOMContentLoaded", async () => {
    const client = await waitForSupabase();
    if (window.QISH && client) {
        await QISH.updateAuthNav({ supabase: client });
    }
    if (client) {
        try {
            const { data } = await client.auth.getSession();
            if (data.session) {
                var goHome = "index.html";
                try { goHome = new URL("index.html", window.location.href).href; } catch (_) {}
                window.location.href = goHome;
            }
        } catch (_) {}
    }
});
</script>
