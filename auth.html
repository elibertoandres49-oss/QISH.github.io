<script>
const glow = document.getElementById('glow');
const sidePanel = document.getElementById('sidePanel');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closePanel');
const avatar = document.querySelector('.nav-avatar');
let mouseX = 0, mouseY = 0;
let currentX = 0, currentY = 0;
let velX = 0, velY = 0;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});
function animate() {
    const dx = mouseX - currentX;
    const dy = mouseY - currentY;
    velX += dx * 0.12;
    velY += dy * 0.12;
    velX *= 0.78;
    velY *= 0.78;
    currentX += velX;
    currentY += velY;
    const speed = Math.sqrt(velX * velX + velY * velY);
    const stretch = Math.min(speed * 0.08, 1.8);
    const angle = Math.atan2(velY, velX) * (180 / Math.PI);
    glow.style.left = currentX + 'px';
    glow.style.top = currentY + 'px';
    glow.style.transform = `translate(-50%, -50%) rotate(${angle}deg) scaleX(${1 + stretch}) scaleY(${1 - stretch * 0.3})`;
    glow.style.borderRadius = stretch > 0.3 ? '40%' : '50%';
    requestAnimationFrame(animate);
}
animate();

document.addEventListener('click', (e) => {
    if (e.target.closest('.nav-avatar') || e.target.closest('.side-panel') || e.target.closest('.close-btn')) return;
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.width = '80px';
    ripple.style.height = '80px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
});

avatar.addEventListener('click', () => {
    sidePanel.classList.add('active');
    overlay.classList.add('active');
    document.getElementById('rightImage').classList.add('active');
});
function closePanel() {
    sidePanel.classList.remove('active');
    overlay.classList.remove('active');
    document.getElementById('rightImage').classList.remove('active');
}
closeBtn.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

// ==========Supabase登录注册逻辑==========
let isLoginMode = true;
const formTitle = document.getElementById('form-title');
const submitBtn = document.getElementById('submit-btn');
const toggleText = document.getElementById('toggle-text');
const toggleBtn = document.getElementById('toggle-mode');
const authForm = document.getElementById('auth-form');
const msgBox = document.getElementById('message');

toggleBtn.addEventListener('click', ()=>{
    isLoginMode = !isLoginMode;
    if(isLoginMode){
        formTitle.innerText = "登录";
        submitBtn.innerText = "登录";
        toggleText.innerText = "没有账号？";
        toggleBtn.innerText = "去注册";
    }else{
        formTitle.innerText = "注册账号";
        submitBtn.innerText = "注册";
        toggleText.innerText = "已有账号？";
        toggleBtn.innerText = "去登录";
    }
    msgBox.innerText = '';
});

authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    msgBox.innerText = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    let res;
    if(isLoginMode){
        res = await supabase.auth.signInWithPassword({email,password});
    }else{
        res = await supabase.auth.signUp({
            email,
            password,
            options:{
                emailRedirectTo:"http://127.0.0.1:5500/auth.html"
            }
        });
    }

    if(res.error){
        msgBox.style.color="red";
        msgBox.innerText = res.error.message;
    }else{
        msgBox.style.color='green';
        if(isLoginMode){
            msgBox.innerText = "登录成功！跳转首页";
            setTimeout(()=>{ window.location.href="index.html"; },1200);
        }else{
            msgBox.innerText = "注册成功，请去邮箱确认邮件（查看垃圾箱）";
        }
    }
})

(async function checkSession(){
    const {data} = await supabase.auth.getSession();
    if(data.session){
        window.location.href="index.html";
    }
})();
</script>
