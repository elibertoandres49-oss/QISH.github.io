<script>
const defaultAvatar = "avatar.jpg";
const CHAT_BUCKET = "chat_bucket";
const ADMIN_UIDS = ["8dbea2a6-e81e-4958-8c7a-3cbb47b2eb7d"];
const RECALL_LIMIT_MS = 2 * 60 * 1000;
const MAX_FILE_SIZE = 15 * 1024 * 1024;

let currentUser = null;
let myNickname = "匿名用户";
let myAvatar = defaultAvatar;
let channel = null;
let allMessages = [];
let supabase = null;

function waitForSb(ms) {
    ms = ms || 6000;
    const t0 = Date.now();
    return new Promise(resolve => {
        (function check() {
            if (window.supabaseClient) { supabase = window.supabaseClient; resolve(); }
            else if (Date.now() - t0 > ms) resolve();
            else setTimeout(check, 80);
        })();
    });
}

async function waitForQISH(ms) {
    ms = ms || 4000;
    const t0 = Date.now();
    while (!window.QISH || !QISH.updateAuthNav) {
        if (Date.now() - t0 > ms) break;
        await new Promise(r => setTimeout(r, 30));
    }
    return window.QISH;
}

async function updateAuthNav() {
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const statusTip = document.getElementById('statusTip');
    await waitForQISH();
    if (!window.QISH || !QISH.updateAuthNav || !supabase) return;
    const r = await QISH.updateAuthNav({ supabase });
    if (r && r.user) {
        currentUser = r.user;
        myAvatar = r.avatar || defaultAvatar;
        myNickname = r.nickname || "匿名用户";
        if (msgInput) msgInput.disabled = false;
        if (sendBtn) sendBtn.disabled = false;
        if (attachBtn) attachBtn.disabled = false;
        if (statusTip) statusTip.innerText = `已登录为 ${myNickname}，可发送文字 / 图片 / 文件`;
    } else {
        currentUser = null; myAvatar = defaultAvatar; myNickname = "匿名用户";
        if (msgInput) msgInput.disabled = true;
        if (sendBtn) sendBtn.disabled = true;
        if (attachBtn) attachBtn.disabled = true;
        if (statusTip) statusTip.innerText = "请先登录后再发言";
    }
}

function formatTime(str) { const d=new Date(str); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function formatSize(bytes) { if(!bytes||bytes<=0)return""; if(bytes<1024)return bytes+" B"; if(bytes<1048576)return (bytes/1024).toFixed(1)+" KB"; return (bytes/1048576).toFixed(1)+" MB"; }
function escapeHtml(text) { if(!text)return""; const d=document.createElement('div'); d.textContent=text; return d.innerHTML; }
function getFileIcon(name) { const e=(name||"").split(".").pop().toLowerCase(); const m={pdf:"📄",doc:"✎",docx:"✎",xls:"📊",xlsx:"📊",ppt:"📑",pptx:"📑",zip:"🗜️",rar:"🗜️","7z":"🗜️",mp3:"♪",wav:"♪",mp4:"🎬",mov:"🎬",txt:"📃",md:"📃"}; return m[e]||"📎"; }
function isImageType(name,mime) { if(mime&&mime.startsWith("image/"))return true; return ["jpg","jpeg","png","gif","webp","bmp","svg"].includes((name||"").split(".").pop().toLowerCase()); }

function appendMessage(item, isMine) {
    if (item && item.id && !allMessages.find(m => m.id === item.id)) allMessages.push(item);
    const area = document.getElementById('messagesArea');
    const empty = document.getElementById('emptyTip');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg-item' + (isMine ? ' mine' : '');
    div.dataset.id = item.id;
    const avatarSrc = item.avatar_url || defaultAvatar;
    const msgType = item.msg_type || (item.file_url ? (isImageType(item.file_name,null)?"image":"file") : "text");
    let bodyHtml = "";
    const animeMatch = (item.content||"").match(/#qish_anime:(\d+)/) || (item.content||"").match(/anime\.html\?id=(\d+)/) || (item.content||"").match(/bgm\.tv\/subject\/(\d+)/);
    const animeId = animeMatch ? animeMatch[1] : null;
    const animeTitleMatch = (item.content||"").match(/【([^】]+)】/);
    const animeTitle = animeTitleMatch ? animeTitleMatch[1] : "新番推荐";
    const animeScoreMatch = (item.content||"").match(/评分\s*([\d.]+)/);
    const animeScore = animeScoreMatch ? animeScoreMatch[1] : "";
    // 音乐卡片检测
    const musicMatch = (item.content||"").match(/#qish_music:([A-Za-z0-9+/=]+)/);
    let musicData = null;
    if (musicMatch) {
        try { musicData = JSON.parse(decodeURIComponent(escape(atob(musicMatch[1])))); } catch(e) { musicData = null; }
    }
    if (animeId) {
        const cover = item.file_url || "";
        bodyHtml = `<div class="msg-content">📺 安利新番</div>
            <a class="msg-anime-card" href="anime.html?id=${animeId}" title="点击查看详情">
                ${cover?`<img src="${cover}" alt="" loading="lazy">`:""}
                <div class="msg-anime-meta"><div class="msg-anime-title">${escapeHtml(animeTitle)}</div>
                <div class="msg-anime-sub">${animeScore?"★ "+escapeHtml(animeScore)+" · ":""}Bangumi</div>
                <div class="msg-anime-go">查看详情 ›</div></div></a>`;
    } else if (musicData) {
        bodyHtml = `<div class="msg-content">♪ 分享音乐</div>
            <div class="msg-music-card" data-url="${escapeHtml(musicData.url||"")}" data-name="${escapeHtml(musicData.name||"")}" data-artist="${escapeHtml(musicData.artist||"")}" data-cover="${escapeHtml(musicData.cover||"")}" title="点击播放">
                ${musicData.cover?`<img src="${escapeHtml(musicData.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:""}
                <div class="msg-music-meta">
                    <div class="msg-music-title">${escapeHtml(musicData.name||"未知歌曲")}</div>
                    <div class="msg-music-artist">${escapeHtml(musicData.artist||"未知歌手")}</div>
                    <div class="msg-music-go">► 点击播放</div>
                </div>
            </div>`;
    } else if (msgType === "image" && item.file_url) {
        bodyHtml = `${item.content?`<div class="msg-content">${escapeHtml(item.content)}</div>`:""}
            <img class="msg-img" src="${escapeHtml(item.file_url)}" alt="图片" loading="lazy" data-preview-url="${escapeHtml(item.file_url)}">`;
    } else if (msgType === "file" && item.file_url) {
        const icon = getFileIcon(item.file_name);
        const sizeStr = formatSize(item.file_size);
        const isAudio = /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(item.file_name||"") || (item.file_url&&/\.(mp3|wav|ogg|m4a|flac|aac)(\?|$)/i.test(item.file_url));
        const audioBtns = isAudio ? `<div class="msg-audio-actions">
            <button type="button" class="msg-audio-btn add" data-url="${escapeHtml(item.file_url)}" data-name="${escapeHtml(item.file_name||'音频')}">♪ 加入播放</button>
            <button type="button" class="msg-audio-btn together" data-url="${escapeHtml(item.file_url)}" data-name="${escapeHtml(item.file_name||'音频')}">🔊 一起听</button></div>` : "";
        bodyHtml = `${item.content?`<div class="msg-content">${escapeHtml(item.content)}</div>`:""}
            <div class="msg-file-card"><div class="msg-file-icon">${icon}</div>
            <div class="msg-file-info"><div class="msg-file-name" title="${escapeHtml(item.file_name||'文件')}">${escapeHtml(item.file_name||'文件')}</div>
            ${sizeStr?`<div class="msg-file-size">${sizeStr}</div>`:""}</div>
            <a class="msg-file-dl" href="${escapeHtml(item.file_url)}" download="${escapeHtml(item.file_name||'download')}" target="_blank" rel="noopener">下载</a></div>${audioBtns}`;
    } else {
        bodyHtml = `<div class="msg-content">${escapeHtml(item.content)}</div>`;
    }
    const canManage = currentUser && (isMine || ADMIN_UIDS.includes(currentUser.id));
    const createdAt = item.created_at ? new Date(item.created_at).getTime() : 0;
    const canRecall = isMine && createdAt && (Date.now()-createdAt <= RECALL_LIMIT_MS);
    let actionsHtml = "";
    if (canManage) {
        actionsHtml = `<div class="msg-actions">`;
        if (canRecall) actionsHtml += `<button type="button" class="msg-act-btn recall" data-action="recall" data-id="${item.id}">撤回</button>`;
        actionsHtml += `<button type="button" class="msg-act-btn del" data-action="delete" data-id="${item.id}">删除</button></div>`;
    }
    div.dataset.userId = item.user_id || "";
    div.dataset.createdAt = item.created_at || "";
    div.innerHTML = `<img class="msg-avatar" src="${escapeHtml(avatarSrc)}" alt="头像" onerror="this.src='${defaultAvatar}'">
        <div class="msg-bubble"><div class="msg-meta"><span class="msg-nick">${escapeHtml(item.nickname||'匿名用户')}</span><span>${formatTime(item.created_at)}</span></div>${bodyHtml}${actionsHtml}</div>`;
    div.querySelectorAll(".msg-img[data-preview-url]").forEach(img => { img.onclick = ev => { ev.stopPropagation(); openImgModal(img.getAttribute("data-preview-url")||img.src); }; });
    div.querySelectorAll(".msg-audio-btn.add").forEach(btn => { btn.onclick = ev => { ev.stopPropagation(); if(window.QISHMusic){QISHMusic.addToPlaylist(btn.dataset.url,btn.dataset.name,false);btn.textContent="✅ 已加入";setTimeout(()=>btn.textContent="♪ 加入播放",1500);}else alert("播放器未就绪，请刷新页面"); }; });
    div.querySelectorAll(".msg-audio-btn.together").forEach(btn => { btn.onclick = ev => { ev.stopPropagation(); if(window.QISHMusic){QISHMusic.playTogether(btn.dataset.url,btn.dataset.name);btn.textContent="🔊 播放中";setTimeout(()=>btn.textContent="🔊 一起听",1500);}else alert("播放器未就绪，请刷新页面"); }; });
    div.querySelectorAll(".msg-music-card").forEach(card => { card.onclick = ev => { ev.stopPropagation(); const url=card.dataset.url; const name=card.dataset.name; if(window.QISHMusic && url){QISHMusic.addToPlaylist(url,name,true);}else alert("播放器未就绪或无播放地址"); }; });
    div.querySelectorAll(".msg-act-btn").forEach(btn => { btn.onclick = async ev => { ev.stopPropagation(); if(btn.dataset.action==="recall") await recallMessage(btn.dataset.id); else if(btn.dataset.action==="delete") await deleteMessage(btn.dataset.id); }; });
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
}

function removeMessageFromDOM(id, tipText) {
    const el = document.querySelector(`.msg-item[data-id="${id}"]`);
    if (!el) return;
    el.classList.add("removing");
    setTimeout(() => {
        el.remove();
        if (tipText) { const area=document.getElementById("messagesArea"); const tip=document.createElement("div"); tip.className="msg-recalled-tip"; tip.textContent=tipText; area.appendChild(tip); setTimeout(()=>tip.remove(),4000); }
        if (!areaHasMessages()) { const area=document.getElementById("messagesArea"); if(area&&!area.querySelector(".msg-item")) area.innerHTML=`<div class="empty-chat" id="emptyTip">还没有消息，来发第一条吧～</div>`; }
    }, 250);
}
function areaHasMessages() { return !!document.querySelector("#messagesArea .msg-item"); }

async function recallMessage(id) {
    if (!currentUser) { alert("请先登录"); return; }
    const el = document.querySelector(`.msg-item[data-id="${id}"]`);
    if (!el) return;
    const created = el.dataset.createdAt ? new Date(el.dataset.createdAt).getTime() : 0;
    if (created && Date.now()-created > RECALL_LIMIT_MS) { alert("已超过 2 分钟，无法撤回，请使用删除"); return; }
    if (el.dataset.userId && el.dataset.userId !== currentUser.id) { alert("只能撤回自己的消息"); return; }
    if (!confirm("确定撤回这条消息？")) return;
    const { error } = await supabase.from("public_messages").delete().eq("id", id);
    if (error) { alert("撤回失败："+error.message); return; }
    removeMessageFromDOM(id, "你撤回了一条消息");
}

async function deleteMessage(id) {
    if (!currentUser) { alert("请先登录"); return; }
    const el = document.querySelector(`.msg-item[data-id="${id}"]`);
    if (!el) return;
    const ownerId = el.dataset.userId;
    const isAdmin = ADMIN_UIDS.includes(currentUser.id);
    if (ownerId !== currentUser.id && !isAdmin) { alert("没有权限删除"); return; }
    if (!confirm("确定删除这条消息？删除后无法恢复")) return;
    const { error } = await supabase.from("public_messages").delete().eq("id", id);
    if (error) { alert("删除失败："+error.message); return; }
    removeMessageFromDOM(id, isAdmin&&ownerId!==currentUser.id?"已删除一条消息":null);
}

function openImgModal(url) { document.getElementById('imgModalImg').src=url; document.getElementById('imgModal').classList.add('active'); }
document.getElementById('imgModalClose').onclick = () => document.getElementById('imgModal').classList.remove('active');
document.getElementById('imgModal').onclick = e => { if(e.target.id==='imgModal') document.getElementById('imgModal').classList.remove('active'); };

async function loadMessages() {
    const area = document.getElementById('messagesArea');
    allMessages = [];
    const { data, error } = await supabase.from("public_messages").select("*").order("created_at",{ascending:true}).limit(150);
    area.innerHTML = "";
    if (error) { area.innerHTML=`<div class="empty-chat">加载消息失败：${error.message}</div>`; return; }
    if (!data||data.length===0) { area.innerHTML=`<div class="empty-chat" id="emptyTip">还没有消息，来发第一条吧～</div>`; return; }
    data.forEach(item => { const isMine=currentUser&&item.user_id===currentUser.id; appendMessage(item,isMine); });
}

function subscribeRealtime() {
    if (channel) supabase.removeChannel(channel);
    channel = supabase.channel('public_messages_channel')
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'public_messages'},payload => {
            const item=payload.new; if(document.querySelector(`[data-id="${item.id}"]`))return;
            appendMessage(item,currentUser&&item.user_id===currentUser.id);
        })
        .on('postgres_changes',{event:'DELETE',schema:'public',table:'public_messages'},payload => {
            const old=payload.old; if(!old||!old.id)return;
            if(document.querySelector(`.msg-item[data-id="${old.id}"]`)) removeMessageFromDOM(old.id,null);
        }).subscribe();
}

async function sendMessage() {
    if (!currentUser) { alert("请先登录"); return; }
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    const { data, error } = await supabase.from("public_messages").insert({user_id:currentUser.id,nickname:myNickname,content,avatar_url:myAvatar,msg_type:"text"}).select().single();
    sendBtn.disabled = false;
    if (error) { alert("发送失败："+error.message); return; }
    input.value = "";
    if (data) appendMessage(data, true);
}

async function sendFile(file) {
    if (!currentUser) { alert("请先登录"); return; }
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) { alert("文件不能超过 15MB"); return; }
    const statusTip = document.getElementById('statusTip');
    const attachBtn = document.getElementById('attachBtn');
    const sendBtn = document.getElementById('sendBtn');
    attachBtn.disabled = true; sendBtn.disabled = true;
    statusTip.innerText = "正在上传文件，请稍候…";
    try {
        const rawExt = (file.name.split(".").pop()||"bin").toLowerCase();
        const ext = rawExt.replace(/[^a-z0-9]/g,"")||"bin";
        const filePath = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).slice(2,9)}.${ext}`;
        const { error: upErr } = await supabase.storage.from(CHAT_BUCKET).upload(filePath, file, {cacheControl:"3600",upsert:false,contentType:file.type||undefined});
        if (upErr) throw new Error("上传失败："+upErr.message);
        const { data: urlObj } = supabase.storage.from(CHAT_BUCKET).getPublicUrl(filePath);
        const fileUrl = urlObj.publicUrl;
        const isImg = isImageType(file.name, file.type);
        const msgType = isImg ? "image" : "file";
        const caption = document.getElementById('msgInput').value.trim();
        const { data, error } = await supabase.from("public_messages").insert({user_id:currentUser.id,nickname:myNickname,content:caption||"",avatar_url:myAvatar,msg_type:msgType,file_url:fileUrl,file_name:file.name,file_size:file.size}).select().single();
        if (error) throw new Error("保存消息失败："+error.message);
        document.getElementById('msgInput').value = "";
        if (data) appendMessage(data, true);
        statusTip.innerText = `已登录为 ${myNickname}，可发送文字 / 图片 / 文件`;
    } catch (e) { console.error(e); alert(e.message||"发送失败"); statusTip.innerText=`已登录为 ${myNickname}，可发送文字 / 图片 / 文件`; }
    finally { attachBtn.disabled=false; sendBtn.disabled=false; document.getElementById('fileInput').value=""; }
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
document.getElementById('attachBtn').onclick = () => { if(!currentUser){alert("请先登录");return;} document.getElementById('fileInput').click(); };
document.getElementById('fileInput').onchange = e => { const f=e.target.files[0]; if(f) sendFile(f); };

(async function init(){
    await waitForSb();
    if (typeof waitForQISH === "function") await waitForQISH();
    await updateAuthNav();
    await loadMessages();
    subscribeRealtime();
    // 检查是否有待分享的音乐
    try {
        const pending = localStorage.getItem("qish-pending-share");
        if (pending) {
            localStorage.removeItem("qish-pending-share");
            const msgInput = document.getElementById('msgInput');
            if (msgInput && currentUser) {
                msgInput.value = pending;
                setTimeout(() => { if (typeof sendMessage === "function") sendMessage(); }, 500);
            }
        }
    } catch(e) {}
})();

if (supabase) supabase.auth.onAuthStateChange(event => { if(event!=="INITIAL_SESSION") updateAuthNav(); });

// 搜索抽屉
(function initSearchDrawer() {
    const toggleBtn = document.getElementById("chatSearchToggle");
    const drawer = document.getElementById("searchDrawer");
    const overlay = document.getElementById("searchDrawerOverlay");
    const closeBtn = document.getElementById("searchDrawerClose");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const filesResults = document.getElementById("filesResults");
    const tabs = document.querySelectorAll(".search-tab");
    if (!toggleBtn||!drawer||!overlay) return;
    function openDrawer() { drawer.classList.add("show"); overlay.classList.add("show"); document.body.style.overflow="hidden"; setTimeout(()=>{if(searchInput)searchInput.focus();},350); const at=document.querySelector(".search-tab.active"); if(at&&at.dataset.tab==="files") renderFiles(); }
    function closeDrawer() { drawer.classList.remove("show"); overlay.classList.remove("show"); document.body.style.overflow=""; }
    toggleBtn.addEventListener("click", openDrawer);
    closeBtn.addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", e => { if(e.key==="Escape"&&drawer.classList.contains("show")) closeDrawer(); });
    tabs.forEach(tab => { tab.addEventListener("click", () => { tabs.forEach(t=>t.classList.remove("active")); tab.classList.add("active"); const target=tab.dataset.tab; if(target==="search"){searchResults.style.display="";filesResults.style.display="none";if(searchInput&&searchInput.value)doSearch(searchInput.value);}else{searchResults.style.display="none";filesResults.style.display="";renderFiles();} }); });
    let searchTimer = null;
    if (searchInput) searchInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer=setTimeout(()=>doSearch(searchInput.value.trim()),250); });
    function escapeHtml2(text) { if(!text)return""; const d=document.createElement("div"); d.textContent=text; return d.innerHTML; }
    function highlight(text,keyword) { if(!keyword)return escapeHtml2(text); const escaped=escapeHtml2(text); const kw=escapeHtml2(keyword).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return escaped.replace(new RegExp(kw,"gi"),m=>`<mark>${m}</mark>`); }
    function doSearch(keyword) {
        if(!searchResults)return;
        if(!keyword){searchResults.innerHTML='<div class="search-empty">输入关键词开始搜索</div>';return;}
        const kw=keyword.toLowerCase();
        const results=allMessages.filter(m=>(m.content||"").toLowerCase().includes(kw)||(m.nickname||"").toLowerCase().includes(kw)||(m.file_name||"").toLowerCase().includes(kw));
        if(results.length===0){searchResults.innerHTML='<div class="search-empty">没有找到相关消息</div>';return;}
        searchResults.innerHTML=results.map(item=>{const isImg=item.msg_type==="image"||(item.file_url&&/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(item.file_name||""));const preview=item.content||(isImg?"[图片]":item.file_name?`[文件] ${item.file_name}`:"");return `<div class="search-result-item" data-id="${item.id}"><div class="search-result-meta"><span class="search-result-nick">${escapeHtml2(item.nickname||"匿名用户")}</span><span>${formatTime(item.created_at)}</span></div><div class="search-result-content">${highlight(preview,keyword)}</div></div>`;}).join("");
        searchResults.querySelectorAll(".search-result-item").forEach(el=>{el.addEventListener("click",()=>{const id=el.dataset.id;const target=document.querySelector(`.msg-item[data-id="${id}"]`);if(target){closeDrawer();setTimeout(()=>{target.scrollIntoView({behavior:"smooth",block:"center"});target.style.transition="background 0.3s ease";target.style.background="rgba(91,168,160,0.2)";setTimeout(()=>target.style.background="",1500);},350);}});});
    }
    function renderFiles() {
        if(!filesResults)return;
        const files=allMessages.filter(m=>m.file_url&&(m.msg_type==="file"||m.msg_type==="image"));
        if(files.length===0){filesResults.innerHTML='<div class="search-empty">暂无文件记录</div>';return;}
        filesResults.innerHTML=files.map(item=>{const isImg=item.msg_type==="image"||/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(item.file_name||"");const icon=isImg?"🖼️":getFileIcon(item.file_name);if(isImg)return `<div class="file-result-item" data-url="${item.file_url}" data-type="image"><img class="file-result-thumb" src="${item.file_url}" alt="${escapeHtml2(item.file_name||'图片')}" loading="lazy"><div class="file-result-info"><div class="file-result-name">${escapeHtml2(item.file_name||"图片")}</div><div class="file-result-meta">${escapeHtml2(item.nickname||"匿名")} · ${formatTime(item.created_at)}</div></div></div>`;return `<div class="file-result-item" data-url="${item.file_url}" data-name="${escapeHtml2(item.file_name||'文件')}" data-type="file"><div class="file-result-icon">${icon}</div><div class="file-result-info"><div class="file-result-name">${escapeHtml2(item.file_name||"文件")}</div><div class="file-result-meta">${escapeHtml2(item.nickname||"匿名")} · ${formatSize(item.file_size)} · ${formatTime(item.created_at)}</div></div></div>`;}).join("");
        filesResults.querySelectorAll(".file-result-item").forEach(el=>{el.addEventListener("click",()=>{const url=el.dataset.url;const type=el.dataset.type;if(type==="image")openImgModal(url);else window.open(url,"_blank");});});
    }
})();
</script>
